function fmt(n) { return n.toLocaleString('de-CH'); }
function fmtRate(n) {
  const s = n > 0 ? '+' : '';
  return s + n.toFixed(2).replace('.', ',') + ' %';
}
function rateColor(n) {
  if (n >= 1) return '#0068A4';
  if (n >= 0.5) return '#3A8BC2';
  if (n >= 0) return '#8FAFC2';
  if (n >= -1) return '#E2A2AC';
  return '#B5001E';
}
function saldoClass(n) {
  if (n > 0) return 'pos';
  if (n < 0) return 'neg';
  return 'neu';
}

const SCALE_MIN = -1.5, SCALE_MAX = 2.0;
function barHtml(rate) {
  const pct = Math.max(0, Math.min(100, ((rate - SCALE_MIN) / (SCALE_MAX - SCALE_MIN)) * 100));
  const zeroPct = ((0 - SCALE_MIN) / (SCALE_MAX - SCALE_MIN)) * 100;
  const color = rateColor(rate);
  let left, width;
  if (rate >= 0) { left = zeroPct; width = pct - zeroPct; }
  else { left = pct; width = zeroPct - pct; }
  return `<div class="wachs-bar-track">
      <div class="wachs-zero" style="left:${zeroPct}%"></div>
      <div class="wachs-bar-fill" style="left:${left}%;width:${width}%;background:${color}"></div>
    </div>
    <span class="wachs-val" style="color:${color}">${fmtRate(rate)}</span>`;
}

let sortKey = 'wachstum_2025_2040_proz';
let sortDir = -1;

function render(filterText) {
  const tbody = document.getElementById('tbody');
  const ft = (filterText || '').trim().toLowerCase();
  let rows = DATA.slice();

  rows.sort((a, b) => {
    const va = a[sortKey], vb = b[sortKey];
    if (typeof va === 'string') return sortDir * va.localeCompare(vb, 'de');
    return sortDir * (va - vb);
  });

  tbody.innerHTML = '';
  let matchCount = 0;
  rows.forEach(r => {
    const isMatch = ft && r.gemeinde.toLowerCase().includes(ft);
    if (isMatch) matchCount++;
    const tr = document.createElement('tr');
    if (isMatch) tr.classList.add('match');
    tr.innerHTML = `
      <td>${r.gemeinde}</td>
      <td class="num-cell">${fmt(r.pop2025)}</td>
      <td class="num-cell">${fmt(r.pop2040)}</td>
      <td class="wachs-cell" title="${r.gemeinde}: ${fmtRate(r.wachstum_2025_2040_proz)} pro Jahr, 2025–2040, Szenario mittel">${barHtml(r.wachstum_2025_2040_proz)}</td>
      <td class="num-cell" title="${r.geburten_2025} Geburten, ${r.todesfaelle_2025} Todesfälle 2025">
        <span class="saldo-chip ${saldoClass(r.saldo_2025)}">${r.saldo_2025 > 0 ? '+' : ''}${fmt(r.saldo_2025)}</span>
      </td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById('resultCount').textContent = ft
    ? `${matchCount} Treffer von ${DATA.length} Gemeinden`
    : `${DATA.length} Gemeinden`;

  const hl = document.getElementById('highlight');
  if (ft && matchCount >= 1) {
    const exact = DATA.find(r => r.gemeinde.toLowerCase() === ft) ||
                  DATA.filter(r => r.gemeinde.toLowerCase().includes(ft))[0];
    document.getElementById('hlName').textContent = exact.gemeinde;
    document.getElementById('hlGrid').innerHTML = `
      <div class="hl-item"><span class="num">${fmt(exact.pop2025)} → ${fmt(exact.pop2040)}</span><span class="lbl">Bevölkerung 2025 → 2040 (Prognose)</span></div>
      <div class="hl-item"><span class="num" style="color:${rateColor(exact.wachstum_2025_2040_proz)}">${fmtRate(exact.wachstum_2025_2040_proz)}</span><span class="lbl">Wachstum pro Jahr (Prognose)</span></div>
      <div class="hl-item"><span class="num">${exact.geburten_2025} / ${exact.todesfaelle_2025}</span><span class="lbl">Geburten / Todesfälle 2025 (real)</span></div>
      <div class="hl-item"><span class="num ${saldoClass(exact.saldo_2025)}">${exact.saldo_2025 > 0 ? '+' : ''}${exact.saldo_2025}</span><span class="lbl">Realer Saldo 2025 (Geburten − Todesfälle)</span></div>
    `;
    hl.classList.add('active');
  } else {
    hl.classList.remove('active');
  }
}

document.querySelectorAll('thead th[data-key]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (sortKey === key) { sortDir *= -1; } else { sortKey = key; sortDir = key === 'gemeinde' ? 1 : -1; }
    document.querySelectorAll('thead th').forEach(t => t.classList.remove('sorted'));
    th.classList.add('sorted');
    render(document.getElementById('search').value);
  });
});

const searchInput = document.getElementById('search');
const clearBtn = document.getElementById('clear');
searchInput.addEventListener('input', () => {
  clearBtn.style.display = searchInput.value ? 'block' : 'none';
  render(searchInput.value);
});
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.style.display = 'none';
  render('');
});

document.getElementById('sortDefault').classList.add('sorted');
render('');
</script>
