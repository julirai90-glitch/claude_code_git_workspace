_2040_proz": -0.21, "wachstum_2040_2055_proz": -0.33, "kategorie_kurzfristig": "-1% bis 0%", "geburten_2025": 6, "todesfaelle_2025": 6, "saldo_2025": 0 }];

// Wurzelskala über alle Geburten- UND Todesfall-Werte gemeinsam
const maxVal = Math.max(...DATA.flatMap(d => [d.geburten_2025, d.todesfaelle_2025]));
function pct(v) { return maxVal > 0 ? (Math.sqrt(v) / Math.sqrt(maxVal)) * 100 : 0; }
function saldoClass(n) { return n > 0 ? 'pos' : n < 0 ? 'neg' : 'neu'; }

const rows = DATA.slice().sort((a, b) => b.saldo_2025 - a.saldo_2025);

const list = document.getElementById('list');
rows.forEach(r => {
  const bx = pct(r.geburten_2025), dx = pct(r.todesfaelle_2025);
  const left = Math.min(bx, dx), width = Math.abs(bx - dx);
  const row = document.createElement('div');
  row.className = 'row';
  row.dataset.name = r.gemeinde.toLowerCase();
  row.innerHTML = `
    <div class="name" title="${r.gemeinde}">${r.gemeinde}</div>
    <div class="scale" title="${r.gemeinde}: ${r.geburten_2025} Geburten, ${r.todesfaelle_2025} Todesfälle 2025">
      <div class="track"></div>
      <div class="connector" style="left:${left}%;width:${width}%"></div>
      <div class="dot births" style="left:${bx}%"></div>
      <div class="dot deaths" style="left:${dx}%"></div>
    </div>
    <div class="saldo ${saldoClass(r.saldo_2025)}">${r.saldo_2025 > 0 ? '+' : ''}${r.saldo_2025}</div>
  `;
  list.appendChild(row);
});

function applyFilter(text) {
  const ft = text.trim().toLowerCase();
  let matchCount = 0;
  let firstMatch = null;
  document.querySelectorAll('.row').forEach(row => {
    const isMatch = ft && row.dataset.name.includes(ft);
    row.classList.toggle('dim', !!ft && !isMatch);
    row.classList.toggle('match', isMatch);
    if (isMatch) { matchCount++; if (!firstMatch) firstMatch = row; }
  });
  document.getElementById('resultCount').textContent = ft
    ? `${matchCount} Treffer von ${rows.length} Gemeinden`
    : `${rows.length} Gemeinden`;
  if (firstMatch) firstMatch.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

const searchInput = document.getElementById('search');
const clearBtn = document.getElementById('clear');
searchInput.addEventListener('input', () => {
  clearBtn.style.display = searchInput.value ? 'block' : 'none';
  applyFilter(searchInput.value);
});
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.style.display = 'none';
  applyFilter('');
});

applyFilter('');
