const DATA = DATA_RAW.map(d => ({
  ...d,
  x: d.wachstum_2025_2040_proz,
  y: (d.saldo_2025 / d.pop2025) * 1000
}));

const margin = { top: 16, right: 16, bottom: 30, left: 34 };
let width, height = 420;

const svg = d3.select('#chart');
const g = svg.append('g');
const tooltip = document.getElementById('tooltip');

const xExtent = d3.extent(DATA, d => d.x);
const yExtent = d3.extent(DATA, d => d.y);
const xPad = (xExtent[1] - xExtent[0]) * 0.08;
const yPad = (yExtent[1] - yExtent[0]) * 0.08;

const x = d3.scaleLinear().domain([xExtent[0] - xPad, xExtent[1] + xPad]);
const y = d3.scaleLinear().domain([yExtent[0] - yPad, yExtent[1] + yPad]);
const r = d3.scaleSqrt().domain([0, d3.max(DATA, d => d.pop2025)]).range([3, 16]);

function color(d) { return d.y >= 0 ? '#0068A4' : '#B5001E'; }

function draw() {
  width = document.getElementById('chart-wrap').clientWidth;
  const w = width - margin.left - margin.right;
  const h = height - margin.top - margin.bottom;
  x.range([0, w]);
  y.range([h, 0]);

  svg.attr('viewBox', `0 0 ${width} ${height}`);
  g.attr('transform', `translate(${margin.left},${margin.top})`);
  g.selectAll('*').remove();

  g.append('g').attr('class', 'axis').attr('transform', `translate(0,${h})`)
    .call(d3.axisBottom(x).ticks(5).tickFormat(d => d + '%'));
  g.append('g').attr('class', 'axis').call(d3.axisLeft(y).ticks(5));

  g.append('text').attr('class', 'axis-label').attr('x', w).attr('y', h - 6).attr('text-anchor', 'end')
    .text('Prognose-Wachstum 2025–2040 →');

  g.append('line').attr('class', 'quad-line').attr('x1', x(0)).attr('x2', x(0)).attr('y1', 0).attr('y2', h);
  g.append('line').attr('class', 'quad-line').attr('x1', 0).attr('x2', w).attr('y1', y(0)).attr('y2', y(0));
  g.append('text').attr('class', 'quad-label').attr('x', w - 4).attr('y', 12).attr('text-anchor', 'end')
    .text('Wachstum bestätigt');
  g.append('text').attr('class', 'quad-label').attr('x', 4).attr('y', h - 4).attr('text-anchor', 'start')
    .text('Rückgang bestätigt');

  const pts = g.selectAll('circle.pt').data(DATA, d => d.geo).enter().append('circle')
    .attr('class', 'pt')
    .attr('cx', d => x(d.x)).attr('cy', d => y(d.y)).attr('r', d => r(d.pop2025))
    .attr('fill', color).attr('fill-opacity', 0.75).attr('stroke', '#fff').attr('stroke-width', 0.6);

  pts.on('mouseenter', function (event, d) { showTooltip(event, d); })
     .on('mousemove', function (event) { positionTooltip(event); })
     .on('mouseleave', hideTooltip)
     .on('click', function (event, d) { showTooltip(event, d); });

  applyFilter(document.getElementById('search').value);
}

function showTooltip(event, d) {
  tooltip.innerHTML = `
    <div class="tt-name">${d.gemeinde}</div>
    <div class="tt-row"><span class="k">Prognose-Wachstum p.a.</span><span class="v">${d.x > 0 ? '+' : ''}${d.x.toFixed(2)} %</span></div>
    <div class="tt-row"><span class="k">Saldo 2025 / 1'000 Einw.</span><span class="v">${d.y > 0 ? '+' : ''}${d.y.toFixed(1)}</span></div>
    <div class="tt-row"><span class="k">Geburten / Todesfälle 2025</span><span class="v">${d.geburten_2025} / ${d.todesfaelle_2025}</span></div>
    <div class="tt-row"><span class="k">Bevölkerung 2025</span><span class="v">${d.pop2025.toLocaleString('de-CH')}</span></div>
  `;
  tooltip.classList.add('visible');
  positionTooltip(event);
}
function positionTooltip(event) {
  const pad = 14;
  let left = event.clientX + pad, top = event.clientY + pad;
  if (left + 230 > window.innerWidth) left = event.clientX - 230 - pad;
  if (top + 110 > window.innerHeight) top = event.clientY - 110 - pad;
  tooltip.style.left = left + 'px';
  tooltip.style.top = top + 'px';
}
function hideTooltip() { tooltip.classList.remove('visible'); }

function applyFilter(text) {
  const ft = text.trim().toLowerCase();
  let matchCount = 0, firstMatch = null;
  g.selectAll('circle.pt').classed('dim', d => !!ft && !d.gemeinde.toLowerCase().includes(ft))
    .classed('match', d => !!ft && d.gemeinde.toLowerCase().includes(ft));
  DATA.forEach(d => { if (ft && d.gemeinde.toLowerCase().includes(ft)) { matchCount++; if (!firstMatch) firstMatch = d; } });
  document.getElementById('resultCount').textContent = ft
    ? `${matchCount} Treffer von ${DATA.length} Gemeinden`
    : `${DATA.length} Gemeinden`;
  if (firstMatch) {
    const node = g.selectAll('circle.pt').filter(d => d.geo === firstMatch.geo).node();
    if (node) {
      const rect = node.getBoundingClientRect();
      showTooltip({ clientX: rect.x, clientY: rect.y }, firstMatch);
    }
  } else {
    hideTooltip();
  }
}

const searchInput = document.getElementById('search');
const clearBtn = document.getElementById('clear');
searchInput.addEventListener('input', () => {
  clearBtn.style.display = searchInput.value ? 'block' : 'none';
  applyFilter(searchInput.value);
});
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.style.display = 'none';
  applyFilter('');
  hideTooltip();
});

draw();
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(draw, 150);
});
</script>
