const parse = d3.timeParse('%Y-%m');
const dates = DATA.dates.map(parse);
const series = key => dates.map((d,i)=>({date:d, v:DATA[key][i]}));
const lik = series('lik'), mahlzeiten = series('mahlzeiten'), getraenke = series('getraenke');

const fmt = v => v.toFixed(1);
const W = 640, H = 300, m = {t:20,r:16,b:32,l:42};
const w = W-m.l-m.r, h = H-m.t-m.b;
const svg = d3.select('#chart').attr('viewBox',`0 0 ${W} ${H}`);
const g = svg.append('g').attr('transform',`translate(${m.l},${m.t})`);

const x = d3.scaleTime().domain(d3.extent(dates)).range([0,w]);
const allVals = lik.concat(mahlzeiten, getraenke).map(d=>d.v);
const y = d3.scaleLinear().domain([90, d3.max(allVals)+8]).range([h,0]);

g.append('g').attr('class','grid').selectAll('line').data(y.ticks(5)).join('line')
  .attr('x1',0).attr('x2',w).attr('y1',d=>y(d)).attr('y2',d=>y(d));
g.append('g').attr('class','axis').attr('transform',`translate(0,${h})`)
  .call(d3.axisBottom(x).ticks(d3.timeYear.every(5)).tickFormat(d3.timeFormat('%Y')));
g.append('g').attr('class','axis')
  .call(d3.axisLeft(y).ticks(5));

const SERIES = [
  {data:lik, color:'#6B6763', label:'Gesamt-Teuerung (LIK)'},
  {data:mahlzeiten, color:'#0068A4', label:'Mahlzeiten Restaurants & Cafés'},
  {data:getraenke, color:'#EE7733', label:'Getränke Restaurants & Cafés'},
];

const line = d3.line().x(d=>x(d.date)).y(d=>y(d.v)).curve(d3.curveMonotoneX);
SERIES.forEach(s=>{
  g.append('path').datum(s.data).attr('fill','none').attr('stroke',s.color).attr('stroke-width',2)
    .attr('stroke-linejoin','round').attr('stroke-linecap','round').attr('d',line);
  const last = s.data[s.data.length-1];
  g.append('circle').attr('cx',x(last.date)).attr('cy',y(last.v)).attr('r',4).attr('fill',s.color)
    .attr('stroke','#fff').attr('stroke-width',2);
  g.append('text').attr('class','end-label').attr('x',x(last.date)+7).attr('y',y(last.v)+4).text(fmt(last.v));
});

const legend = d3.select('#legend');
SERIES.forEach(s=>{
  const it = legend.append('div').attr('class','legend-item');
  it.append('div').attr('class','legend-dot').style('background',s.color);
  it.append('div').text(s.label);
});

const bisect = d3.bisector(d=>d.date).left;
const hLine = g.append('line').attr('class','annot-line').attr('y1',0).attr('y2',h).style('display','none');
const dots = SERIES.map(s=>g.append('circle').attr('r',4.5).attr('fill',s.color).attr('stroke','#fff').attr('stroke-width',2).style('display','none'));
const tt = document.getElementById('tt');
const fmtMonth = d3.timeFormat('%B %Y');

svg.append('rect').attr('fill','none').attr('pointer-events','all')
  .attr('x',m.l).attr('y',m.t).attr('width',w).attr('height',h)
  .on('mousemove', function(e) {
    const [mx] = d3.pointer(e, this);
    const dt = x.invert(mx-m.l);
    const i = Math.min(bisect(lik, dt), lik.length-1);
    hLine.attr('x1',x(lik[i].date)).attr('x2',x(lik[i].date)).style('display',null);
    let rows = '';
    SERIES.forEach((s,idx)=>{
      const d = s.data[i];
      dots[idx].attr('cx',x(d.date)).attr('cy',y(d.v)).style('display',null);
      rows += `<div class="tt-row"><span class="k">${s.label}</span><span class="v">${fmt(d.v)}</span></div>`;
    });
    tt.innerHTML = `<div class="tt-title">${fmtMonth(lik[i].date)}</div>${rows}`;
    tt.style.left = (e.clientX+14)+'px'; tt.style.top = (e.clientY-70)+'px';
    tt.classList.add('visible');
  })
  .on('mouseleave', ()=>{ hLine.style('display','none'); dots.forEach(d=>d.style('display','none')); tt.classList.remove('visible'); });
</script>
