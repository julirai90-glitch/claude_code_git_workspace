<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sommertage Davos 1959–2025</title>
<style>
  :root{--blau:#0068A4;--orange:#EE7733;--grau:#6b7280;--hell:#eef2f5;}
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:#1f2937;margin:0;padding:12px;background:#fff;}
  .card{max-width:480px;margin:0 auto;border:1px solid #e5e7eb;border-radius:14px;
        padding:14px 16px 16px;box-shadow:0 4px 18px rgba(0,0,0,.06);position:relative;overflow:hidden;}
  .accent{position:absolute;top:0;left:0;right:0;height:4px;background:var(--blau);}
  .kicker{color:var(--orange);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.68rem;margin-bottom:2px;}
  .title{font-size:.95rem;font-weight:700;margin:0 0 10px;line-height:1.3;}
  svg{width:100%;display:block;touch-action:none;cursor:crosshair;overflow:visible;}
  .scalebar{display:flex;align-items:center;gap:6px;font-size:.68rem;color:var(--grau);margin-top:6px;}
  .scalebar .grad{height:10px;flex:1;border-radius:3px;
    background:linear-gradient(90deg,#08306b,#4a90c2,#f7f7f7,#d6604d,#67000d);}
  .callout{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0;}
  .chip{background:var(--hell);border-radius:8px;padding:6px 10px;font-size:.74rem;}
  .chip b{display:block;font-size:1.05rem;line-height:1.2;}
  .chip.hot b{color:#c0392b;} .chip.rec b{color:#c0392b;}
  .note{font-size:.66rem;color:var(--grau);margin-top:10px;line-height:1.4;}
  .tip{position:fixed;pointer-events:none;background:#fff;border:1px solid #d1d5db;
       border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.14);padding:6px 10px;
       font-size:.78rem;opacity:0;transition:opacity .07s;z-index:60;}
  .tip b{display:block;font-size:.9rem;margin-bottom:2px;}

  .bar-chart{position:relative;}
</style>
</head>
<body>
<div class="card">
  <div class="accent"></div>
  <div class="kicker">Davos · Sommertage (≥ 25 °C) seit 1959</div>
  <div class="title">Wie viele Tage im Jahr überschritt die Temperatur 25 Grad?</div>
  <svg id="svg" viewBox="0 0 460 200" role="img" aria-label="Sommertage Davos 1959-2025"></svg>
  <div class="callout">
    <div class="chip"><b>5.7</b>Durchschnitt 1991–2020</div>
    <div class="chip hot"><b id="rec-val"></b>Rekordjahr</div>
  </div>
  <p class="note">Quelle: MeteoSchweiz, homogene Klimamessreihe Davos (NBCN, 1594 m), 1959–2025.
  Sommertage = Tage mit Tagesmaximum ≥ 25 °C. Linie = gleitendes 10-Jahres-Mittel.</p>
</div>
<div class="tip" id="tip"></div>
<script>
const DATA=[{"y": 1959, "s": 0}, {"y": 1960, "s": 0}, {"y": 1961, "s": 0}, {"y": 1962, "s": 1}, {"y": 1963, "s": 1}, {"y": 1964, "s": 0}, {"y": 1965, "s": 2}, {"y": 1966, "s": 1}, {"y": 1967, "s": 0}, {"y": 1968, "s": 4}, {"y": 1969, "s": 0}, {"y": 1970, "s": 1}, {"y": 1971, "s": 2}, {"y": 1972, "s": 3}, {"y": 1973, "s": 0}, {"y": 1974, "s": 2}, {"y": 1975, "s": 0}, {"y": 1976, "s": 0}, {"y": 1977, "s": 0}, {"y": 1978, "s": 0}, {"y": 1979, "s": 0}, {"y": 1980, "s": 3}, {"y": 1981, "s": 2}, {"y": 1982, "s": 1}, {"y": 1983, "s": 8}, {"y": 1984, "s": 4}, {"y": 1985, "s": 2}, {"y": 1986, "s": 1}, {"y": 1987, "s": 0}, {"y": 1988, "s": 1}, {"y": 1989, "s": 0}, {"y": 1990, "s": 1}, {"y": 1991, "s": 1}, {"y": 1992, "s": 7}, {"y": 1993, "s": 2}, {"y": 1994, "s": 4}, {"y": 1995, "s": 3}, {"y": 1996, "s": 0}, {"y": 1997, "s": 0}, {"y": 1998, "s": 6}, {"y": 1999, "s": 1}, {"y": 2000, "s": 5}, {"y": 2001, "s": 1}, {"y": 2002, "s": 5}, {"y": 2003, "s": 16}, {"y": 2004, "s": 0}, {"y": 2005, "s": 5}, {"y": 2006, "s": 12}, {"y": 2007, "s": 5}, {"y": 2008, "s": 1}, {"y": 2009, "s": 2}, {"y": 2010, "s": 8}, {"y": 2011, "s": 6}, {"y": 2012, "s": 9}, {"y": 2013, "s": 9}, {"y": 2014, "s": 4}, {"y": 2015, "s": 19}, {"y": 2016, "s": 6}, {"y": 2017, "s": 8}, {"y": 2018, "s": 7}, {"y": 2019, "s": 13}, {"y": 2020, "s": 5}, {"y": 2021, "s": 4}, {"y": 2022, "s": 10}, {"y": 2023, "s": 17}, {"y": 2024, "s": 8}, {"y": 2025, "s": 14}];
const NORM=5.7;
const rec=DATA.reduce((a,b)=>b.s>a.s?b:a);
document.getElementById('rec-val').textContent=rec.s+' Tage · '+rec.y;
const svg=document.getElementById('svg');
const W=460,H=200,m={l:28,r:10,t:12,b:22};
const ymax=Math.ceil(Math.max(...DATA.map(d=>d.s))/5)*5+2;
const X=i=>m.l+(i/(DATA.length-1))*(W-m.l-m.r);
const Y=v=>H-m.b-v/ymax*(H-m.t-m.b);
let s='';
// grid
[0,5,10,15,20].filter(v=>v<=ymax).forEach(v=>{
  s+=`<line x1="${m.l}" y1="${Y(v).toFixed(1)}" x2="${W-m.r}" y2="${Y(v).toFixed(1)}" stroke="#f0f0f0"/>`;
  s+=`<text x="${m.l-4}" y="${Y(v)+3}" text-anchor="end" font-size="9" fill="#9ca3af">${v}</text>`;
});
// normal line
s+=`<line x1="${m.l}" y1="${Y(NORM).toFixed(1)}" x2="${W-m.r}" y2="${Y(NORM).toFixed(1)}" stroke="#EE7733" stroke-width="1" stroke-dasharray="4 3" opacity=".7"/>`;
// bars
const bw=Math.max(1,(W-m.l-m.r)/DATA.length*0.75);
DATA.forEach((d,i)=>{
  const recent=d.y>=2000;
  s+=`<rect x="${(X(i)-bw/2).toFixed(1)}" y="${Y(d.s).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H-m.b-Y(d.s)).toFixed(1)}" fill="${recent?'#EE7733':'#f0b87a'}" opacity="${recent?'0.9':'0.7'}"/>`;
});
// running mean
function rm(arr,w){const h=(w-1)/2,o=[];for(let i=0;i<arr.length;i++){let s2=0,n=0;for(let j=Math.ceil(i-h);j<=Math.floor(i+h);j++){if(arr[j]!=null){s2+=arr[j].s;n++;}}o.push(n?s2/n:null);}return o;}
const rm10=rm(DATA,10);
let p='';
DATA.forEach((d,i)=>{if(rm10[i]!=null)p+=(p?'L':'M')+X(i).toFixed(1)+' '+Y(rm10[i]).toFixed(1);} );
s+=`<path d="${p}" fill="none" stroke="#0068A4" stroke-width="2.2"/>`;
// x-axis ticks
[1960,1980,2000,2020].forEach(y=>{
  const i=DATA.findIndex(d=>d.y===y); if(i<0)return;
  s+=`<text x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" fill="#9ca3af">${y}</text>`;
});
svg.innerHTML=s;
const tip=document.getElementById('tip');
svg.addEventListener('pointermove',ev=>{
  const r=svg.getBoundingClientRect();
  const xi=(ev.clientX-r.left)/r.width*(W-m.l-m.r);
  const i=Math.max(0,Math.min(DATA.length-1,Math.round(xi/(W-m.l-m.r)*(DATA.length-1))));
  const d=DATA[i];
  tip.innerHTML=`<b>${d.y}</b>${d.s} Sommertage`;
  tip.style.opacity=1;
  let lx=ev.clientX+12; if(lx+130>window.innerWidth)lx=ev.clientX-134;
  tip.style.left=Math.max(4,lx)+'px'; tip.style.top=(ev.clientY-38)+'px';
});
svg.addEventListener('pointerleave',()=>tip.style.opacity=0);
</script>
</body>
</html>
