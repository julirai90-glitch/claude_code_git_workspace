<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live-Temperatur Arosa</title>
<style>
  :root{--blau:#0068A4;--orange:#EE7733;--grau:#6b7280;--hell:#eef2f5;--rot:#c0392b;}
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:#1f2937;margin:0;padding:12px;background:#fff;}
  .card{max-width:696px;margin:0 auto;border:1px solid #e5e7eb;border-radius:16px;
        padding:16px 18px 18px;box-shadow:0 4px 18px rgba(0,0,0,.06);position:relative;overflow:hidden;}
  .accent{position:absolute;top:0;left:0;right:0;height:4px;background:var(--blau);transition:background .6s;}
  .head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .kicker{color:var(--orange);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.72rem;}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;color:var(--grau);}
  .dot{width:9px;height:9px;border-radius:50%;background:#16a34a;animation:pulse 2s infinite;}
  .dot.off{background:#9ca3af;animation:none;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%{box-shadow:0 0 0 8px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
  .now{display:flex;align-items:baseline;gap:10px;margin:0 0 2px;}
  .now b{font-size:3.4rem;line-height:1;font-weight:800;color:var(--blau);transition:color .6s;font-variant-numeric:tabular-nums;}
  .now .u{font-size:1.3rem;color:var(--grau);font-weight:700;}
  .stamp{font-size:.76rem;color:var(--grau);margin-bottom:10px;min-height:1.2em;}
  /* scrollable chart */
  .tabs{display:flex;gap:6px;margin-bottom:8px;}
  .tab{background:var(--hell);border:none;border-radius:8px;padding:4px 11px;
       font-size:.74rem;cursor:pointer;color:var(--grau);font-family:inherit;}
  .tab.active{background:var(--blau);color:#fff;font-weight:600;}
  .chart-outer{position:relative;}
  .scroll-wrap{overflow-x:auto;overflow-y:hidden;width:100%;
               -webkit-overflow-scrolling:touch;
               scrollbar-width:thin;scrollbar-color:#d1d5db transparent;}
  .scroll-wrap::-webkit-scrollbar{height:4px;}
  .scroll-wrap::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:2px;}
  .chart-svg{display:block;height:120px;}
  .now-btn{position:absolute;right:0;top:50%;transform:translateY(-50%);
           background:#fff;border:1px solid #d1d5db;border-radius:20px;
           padding:4px 10px;font-size:.7rem;color:#374151;cursor:pointer;
           box-shadow:0 2px 8px rgba(0,0,0,.1);white-space:nowrap;
           opacity:0;pointer-events:none;transition:opacity .2s;}
  .now-btn.vis{opacity:1;pointer-events:auto;}
  /* stats */
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .stat{flex:1;min-width:110px;background:var(--hell);border-radius:10px;padding:9px 11px;}
  .stat b{font-size:1.15rem;display:block;line-height:1.2;font-variant-numeric:tabular-nums;}
  .stat span{font-size:.7rem;color:var(--grau);line-height:1.3;}
  .stat.warm b{color:var(--orange);}.stat.cool b{color:var(--blau);}
  .stat.rec b{color:var(--rot);}.stat.mean b{color:#1f2937;}
  /* record bar */
  .bar{position:relative;height:11px;border-radius:6px;margin:14px 0 3px;
       background:linear-gradient(90deg,#1d4e89 0%,#4a90c2 23%,#cfd8dc 46%,#f0b07a 72%,#c0392b 100%);}
  .bar .cur{position:absolute;top:-4px;width:4px;height:19px;border-radius:2px;background:#0a3d62;transition:left .5s;}
  .bar .tick{position:absolute;top:-3px;width:2px;height:17px;border-radius:1px;opacity:.85;}
  .bar .tick.hot{background:var(--rot);}.bar .tick.cold{background:#1d4e89;}
  .bar .lbl{position:absolute;top:-18px;font-size:.58rem;transform:translateX(-50%);white-space:nowrap;font-weight:700;}
  .bar .lbl.hot{color:var(--rot);}.bar .lbl.cold{color:#1d4e89;}
  .scale{display:flex;justify-content:space-between;font-size:.64rem;color:#9ca3af;}
  /* tropen */
  .extra{margin-top:10px;font-size:.82rem;color:var(--grau);}
  .extra .big{font-size:1rem;font-weight:700;color:#1f2937;}
  .tropen{display:inline-block;background:#fdecea;color:var(--rot);font-weight:600;
          font-size:.76rem;padding:3px 9px;border-radius:20px;}
  .note{font-size:.68rem;color:var(--grau);margin-top:14px;line-height:1.45;}
  .err{color:#b45309;font-size:.8rem;}
  .tip{position:fixed;pointer-events:none;background:#fff;border:1px solid #d1d5db;
       border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.14);padding:7px 10px;
       font-size:.78rem;opacity:0;transition:opacity .07s;z-index:60;}
  .tip b{display:block;font-size:.92rem;margin-bottom:2px;}
</style>
</head>
<body>
<div class="card">
  <div class="accent" id="accent"></div>
  <div class="head">
    <span class="kicker">Arosa · Temperatur jetzt</span>
    <span class="live"><span class="dot" id="dot"></span><span id="livelbl">live</span></span>
  </div>
  <div class="now"><b id="cur">–</b><span class="u">°C</span></div>
  <div class="stamp" id="stamp">lade aktuelle Messung …</div>

  <div class="tabs">
    <button class="tab" data-days="1">24 h</button>
    <button class="tab active" data-days="3">3 Tage</button>
    <button class="tab" data-days="7">7 Tage</button>
    <button class="tab" data-days="30">30 Tage</button>
  </div>
  <div class="chart-outer">
    <div class="scroll-wrap" id="scroller">
      <svg class="chart-svg" id="curve" role="img" aria-label="Temperaturverlauf"></svg>
    </div>
    <button class="now-btn" id="nowbtn">Jetzt →</button>
  </div>

  <div class="stats" id="ctx"></div>
  <div class="extra" id="extra"></div>

  <div class="bar" id="bar">
    <div class="tick cold" id="tick-cold"></div><div class="lbl cold" id="lbl-cold"></div>
    <div class="tick hot" id="tick-hot"></div><div class="lbl hot" id="lbl-hot"></div>
    <div class="cur" id="curmark"></div>
  </div>
  <div class="scale"><span>−35 °C</span><span>Allzeit-Rekorde</span><span>+35 °C</span></div>

  <p class="note" id="note">

    <b>Aktuelle Werte provisorisch und unkorrigiert.</b>
    Zeiten in Schweizer Zeit. Gestrichelt = Tagesdurchschnitt 1991–2020.
    <span id="note-normal"></span> Aktualisiert sich automatisch.
  </p>
</div>
<div class="tip" id="tip"></div>

const ZRH={timeZone:'Europe/Zurich'};
const localDay=dt=>dt.toLocaleDateString('en-CA',ZRH);
const localMMDD=dt=>localDay(dt).slice(5);

function parseMeteoDate(str){if(!str)return null;const m=String(str).trim().match(/^(\d{2})\.(\d{2})\.(\d{4})(?: (\d{2}):(\d{2}))?$/);if(m){const[,d,mo,y,h='00',mi='00']=m;const dt=new Date(Date.UTC(+y,+mo-1,+d,+h,+mi));if(!isNaN(dt))return dt;}return null;}

  const Y=v=>SVG_H-MB-(v-vmin)/(vmax-vmin)*(SVG_H-MT-MB);

  let s=`<defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">${gstops}</linearGradient><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${cc}" stop-opacity=".16"/><stop offset="1" stop-color="${cc}" stop-opacity="0"/></linearGradient><clipPath id="cl"><rect x="${ML}" y="${MT}" width="${W-ML-MR}" height="${SVG_H-MT-MB}"/></clipPath></defs>`;

    const dayPts=pts.filter(p=>localDay(new Date(p.ms))===k);
    if(!dayPts.length)return;
    if(di>0){const x=X(dayPts[0].ms);s+=`<line x1="${x.toFixed(1)}" y1="${MT}" x2="${x.toFixed(1)}" y2="${SVG_H-MB}" stroke="#e8eaed"/>`;} 
    const mid=dayPts[Math.floor(dayPts.length/2)].ms;
    const dt=new Date(mid);
    s+=`<text x="${X(mid).toFixed(1)}" y="${SVG_H-3}" text-anchor="middle" font-size="9" fill="#b0b7c0">${shortDate(dt)}</text>`;
    const nv=NORMAL[k.slice(5)];
    if(nv!=null){const x0=X(dayPts[0].ms),x1=X(dayPts[dayPts.length-1].ms),ny=Y(nv).toFixed(1);s+=`<line x1="${x0.toFixed(1)}" y1="${ny}" x2="${x1.toFixed(1)}" y2="${ny}" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3"/>`;}
  });
  // 6h ticks
  for(let t=Math.ceil(startMs/3600000)*3600000;t<=endMs;t+=3600000){
    const dt=new Date(t),hh=+dt.toLocaleString('en-GB',{hour:'2-digit',hour12:false,timeZone:'Europe/Zurich'});
    if(hh%6!==0)continue;
    const x=X(t);
    s+=`<line x1="${x.toFixed(1)}" y1="${SVG_H-MB}" x2="${x.toFixed(1)}" y2="${SVG_H-MB+3}" stroke="#d1d5db"/>`;
    if(hh!==0)s+=`<text x="${x.toFixed(1)}" y="${SVG_H-3}" text-anchor="middle" font-size="9" fill="#c4c9d0">${hh}h</text>`;
  }
  // area + line
  let d='';pts.forEach((p,i)=>{d+=(i?'L':'M')+X(p.ms).toFixed(1)+' '+Y(p.v).toFixed(1);});
  s+=`<path d="${d}L${X(endMs).toFixed(1)} ${SVG_H-MB}L${X(startMs).toFixed(1)} ${SVG_H-MB}Z" fill="url(#ag)" clip-path="url(#cl)"/>`;
  s+=`<path d="${d}" fill="none" stroke="url(#lg)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" clip-path="url(#cl)"/>`;
  // pulsing now dot
  s+=`<circle cx="${X(last.ms).toFixed(1)}" cy="${Y(last.v).toFixed(1)}" r="4.5" fill="${cc}"/>`;
  s+=`<circle cx="${X(last.ms).toFixed(1)}" cy="${Y(last.v).toFixed(1)}" r="4.5" fill="${cc}" opacity=".35"><animate attributeName="r" values="4.5;9;4.5" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;0;.35" dur="2s" repeatCount="indefinite"/></circle>`;
  s+=`<line id="hl" y1="${MT}" y2="${SVG_H-MB}" stroke="#64748b" stroke-width="1" stroke-dasharray="3 2" opacity="0"/>`;
  s+=`<circle id="hp" r="4.5" fill="#fff" stroke="#0a3d62" stroke-width="2" opacity="0"/>`;
  svg.innerHTML=s;
  CHART={pts,X,Y,W};
}

/* ---- range ---- */
function setRange(days){
  DAYS=days;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',+t.dataset.days===days));
  const cutoff=Date.now()-days*24*3600000;
  drawChart(ALL_PTS.filter(p=>p.ms>=cutoff));
  requestAnimationFrame(()=>{scroller.scrollLeft=scroller.scrollWidth;});
}

/* ---- jetzt btn ---- */
scroller.addEventListener('scroll',()=>{
  const atEnd=scroller.scrollLeft+scroller.clientWidth>=scroller.scrollWidth-10;
  nowBtn.classList.toggle('vis',!atEnd);
});
nowBtn.addEventListener('click',()=>scroller.scrollTo({left:scroller.scrollWidth,behavior:'smooth'}));

/* ---- tooltip ---- */
const tip=$('tip');
const svgEl=$('curve');
function hover(ev){
  if(!CHART.pts||!CHART.pts.length)return;
  const rect=svgEl.getBoundingClientRect();
  const cx=ev.touches?ev.touches[0].clientX:ev.clientX;
  const svgX=(cx-rect.left)/rect.width*CHART.W;
  let best=CHART.pts[0],bd=1e12;
  CHART.pts.forEach(p=>{const d=Math.abs(CHART.X(p.ms)-svgX);if(d<bd){bd=d;best=p;}});
  const dt=new Date(best.ms),nv=NORMAL[localMMDD(dt)],diff=nv!=null?best.v-nv:null;
  tip.innerHTML=`<b>${shortDate(dt)}, ${hhmm(dt)}</b>${best.v.toFixed(1)} °C${diff!=null?' · '+(diff>=0?'+':'')+diff.toFixed(1)+' vs. Normal':''}`;
  tip.style.opacity=1;
  let lx=cx+14;if(lx+200>window.innerWidth)lx=cx-204;
  let ty=(ev.touches?ev.touches[0].clientY:ev.clientY)-44;
  tip.style.left=Math.max(4,lx)+'px';tip.style.top=Math.max(4,ty)+'px';
  const hl=document.getElementById('hl'),hp=document.getElementById('hp');
  if(hl){hl.setAttribute('x1',CHART.X(best.ms).toFixed(1));hl.setAttribute('x2',CHART.X(best.ms).toFixed(1));hl.setAttribute('opacity','0.7');}
  if(hp){hp.setAttribute('cx',CHART.X(best.ms).toFixed(1));hp.setAttribute('cy',CHART.Y(best.v).toFixed(1));hp.setAttribute('opacity','1');}
}
svgEl.addEventListener('pointermove',hover);
svgEl.addEventListener('pointerdown',hover);
svgEl.addEventListener('pointerleave',()=>{tip.style.opacity=0;['hl','hp'].forEach(id=>{const el=document.getElementById(id);if(el)el.setAttribute('opacity','0');});});

/* ---- tabs ---- */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>setRange(+t.dataset.days)));

/* ---- load ---- */
async function load(){
  if(!navigator.onLine)return fail('offline');
  try{
    const [hRows,nowRows]=await Promise.all([
      csvCached(HREC_URL,HCACHE,20*60000),
      csvFetch(NOW_URL)
    ]);
    const iHt=hRows[0].indexOf('reference_timestamp'),iHv=hRows[0].indexOf('tre200h0');
    const iNt=nowRows[0].indexOf('reference_timestamp'),iNv=nowRows[0].indexOf('tre200s0');
    const map=new Map();
    for(let i=1;i<hRows.length;i++){const dt=parseMeteoDate(hRows[i][iHt]);const v=num(hRows[i][iHv]);if(dt&&v!=null)map.set(dt.getTime(),v);}
    let cur=null,curDt=null;
    for(let i=1;i<nowRows.length;i++){const dt=parseMeteoDate(nowRows[i][iNt]);const v=num(nowRows[i][iNv]);if(dt&&v!=null){map.set(dt.getTime(),v);cur=v;curDt=dt;}}
    if(cur==null)throw new Error('keine Werte');
    ALL_PTS=[...map.entries()].map(([ms,v])=>({ms,v})).sort((a,b)=>a.ms-b.ms);

    const cc=tempColor(cur);
    $('cur').textContent=cur.toFixed(1);$('cur').style.color=cc;$('accent').style.background=cc;
    const age=Math.round((Date.now()-curDt.getTime())/60000);
    $('stamp').textContent=`Stand: ${hhmm(curDt)} Uhr · vor ${age} Min`;
    placeBar(cur);
    $('dot').classList.remove('off');$('livelbl').textContent='live';

    // stats
    const last24=ALL_PTS.filter(p=>p.ms>=Date.now()-24*3600000);
    const ctx=$('ctx');ctx.innerHTML='';
    const extra=$('extra');extra.innerHTML='';
    if(last24.length){
      const mean24=last24.reduce((a,p)=>a+p.v,0)/last24.length;
      const mx=Math.max(...last24.map(p=>p.v));
      const mn=Math.min(...last24.map(p=>p.v));
      const normToday=NORMAL[localMMDD(new Date())];
      // mean tile
      const t0=document.createElement('div');t0.className='stat mean';
      t0.innerHTML=`<b>${mean24.toFixed(1)} °C</b><span>Mittel 24 h</span>`;ctx.appendChild(t0);
      // wärmer/kühler tile
      if(normToday!=null){
        const delta=mean24-normToday,warm=delta>=0;
        const t1=document.createElement('div');t1.className='stat '+(warm?'warm':'cool');
        t1.innerHTML=`<b>${warm?'+':'−'}${Math.abs(delta).toFixed(1)} °C</b><span>${warm?'wärmer':'kühler'} als üblich<br>(Normal: ${normToday} °C)</span>`;ctx.appendChild(t1);
        $('note-normal').textContent=`Vergleich: Mittel 24 h vs. üblicher ${deDay(new Date())} (1991–2020: ${normToday} °C).`;
      }
      // distance to record
      const t2=document.createElement('div');t2.className='stat rec';
      t2.innerHTML=`<b>${(REC_HOT.t-mx).toFixed(1)} °C</b><span>unter Rekord<br>(${REC_HOT.t} °C, ${REC_HOT.d.slice(-4)})</span>`;ctx.appendChild(t2);
      // tropennacht
      if(mn>=20){const sp=document.createElement('span');sp.className='tropen';sp.textContent='Tropennacht – Minimum nicht unter 20 °C';extra.appendChild(sp);}
    }
    // summer days
    try{
      const d=await csvCached(DREC_URL,DCACHE,30*60000);
      const iMax=d[0].indexOf('tre200dx'),iDay=d[0].indexOf('reference_timestamp');
      if(iMax>=0&&iDay>=0){
        let sd=0;for(let k=1;k<d.length;k++){const dt=parseMeteoDate(d[k][iDay]);const mx=num(d[k][iMax]);if(dt&&dt.getUTCFullYear()===YEAR&&mx!=null&&mx>=25)sd++;}
        if(sd>0){
          if(extra.firstChild)extra.appendChild(document.createElement('br'));
          const big=document.createElement('span');big.className='big';big.textContent=sd;extra.appendChild(big);
          const lab=document.createTextNode(` Sommertage ${YEAR} bisher${SUMMER_NORMAL?' · Normal: '+SUMMER_NORMAL+'/Jahr':''}`);extra.appendChild(lab);
        }
      }
    }catch(e){}

    setRange(DAYS);
  }catch(e){fail(e.message);}
}
function fail(msg){
  $('dot').classList.add('off');$('livelbl').textContent='offline';
  $('cur').textContent='–';$('cur').style.color='var(--grau)';
  $('stamp').innerHTML=`<span class="err">${msg==='offline'?'Keine Verbindung.':'Daten momentan nicht verfügbar.'}</span>`;
}
document.addEventListener('visibilitychange',()=>document.hidden?null:load());
window.addEventListener('online',load);
let timer=setInterval(load,3*60*1000);
load();
</script>
