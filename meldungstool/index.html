<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meldungstool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.55;
  transition: background 200ms ease, color 200ms ease;
}

:root, [data-theme="light"] {
  --bg: #FFFFFF;
  --surface: #F7F7F7;
  --surface-hi: #EDEDED;
  --border: #E2E2E2;
  --border-hi: #CCCCCC;
  --text: #000000;
  --text-dim: #5A5A5A;
  --text-mute: #A0A0A0;
  --red: #E10A0A;
  --red-dim: #FCE7E7;
  --red-glow: rgba(225,10,10,0.12);
  --green: #1a8a3a;
  --green-dim: #e6f5ec;
  --masthead-bg: #000000;
  --masthead-fg: #FFFFFF;
  --invert-btn-bg: #000000;
  --invert-btn-fg: #FFFFFF;
}
[data-theme="dark"] {
  --bg: #000000;
  --surface: #0A0A0A;
  --surface-hi: #141414;
  --border: #1F1F1F;
  --border-hi: #2A2A2A;
  --text: #FFFFFF;
  --text-dim: #A8A8A8;
  --text-mute: #5A5A5A;
  --red: #FF2D2D;
  --red-dim: #3A0F12;
  --red-glow: rgba(255,45,45,0.12);
  --green: #4ade80;
  --green-dim: #0a2e15;
  --masthead-bg: #000000;
  --masthead-fg: #FFFFFF;
  --invert-btn-bg: #FFFFFF;
  --invert-btn-fg: #000000;
}

.mono { font-family: "JetBrains Mono", "SF Mono", Menlo, monospace; }

/* ===== MASTHEAD ===== */
.masthead {
  background: var(--masthead-bg);
  color: var(--masthead-fg);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 50;
}
.masthead-brand { display: flex; align-items: center; gap: 10px; }
.masthead-dot { width: 7px; height: 7px; background: #fff; border-radius: 0; flex-shrink: 0; }
.masthead-wordmark {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2.5px;
  color: #fff;
}
.masthead-sub {
  font-family: "JetBrains Mono", monospace;
  font-size: 9px;
  font-weight: 400;
  letter-spacing: 1.5px;
  color: rgba(255,255,255,0.5);
  margin-top: 1px;
}
.theme-switch {
  display: inline-flex;
  border: 1px solid rgba(255,255,255,0.3);
}
.theme-switch button {
  padding: 5px 11px;
  background: transparent;
  border: none;
  color: rgba(255,255,255,0.5);
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  letter-spacing: 1.2px;
  font-weight: 700;
  cursor: pointer;
}
.theme-switch button.on { background: rgba(255,255,255,0.15); color: #fff; }

/* ===== LAYOUT ===== */
.page { max-width: 1320px; margin: 0 auto; padding: 28px 24px 80px; }

/* ===== BADGE ===== */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  border: 1px solid var(--border-hi);
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.2px;
  background: transparent;
  color: var(--text-mute);
}
.badge.red { border-color: var(--red); color: var(--red); background: var(--red-glow); }
.badge.green { border-color: var(--green); color: var(--green); background: var(--green-dim); }
.badge.muted { border-color: var(--border-hi); color: var(--text-mute); }
.badge .pip { width: 5px; height: 5px; background: currentColor; border-radius: 0; flex-shrink: 0; }

/* ===== REVIEW PANEL ===== */
.review-panel { margin-top: 12px; border: 1px solid var(--border); background: var(--surface); }
.review-header { padding: 9px 12px; display: flex; align-items: center; gap: 8px; background: var(--surface-hi); border-bottom: 1px solid var(--border); }
.review-label { font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: var(--text-dim); flex: 1; }
.review-panel details > summary { padding: 8px 12px; font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--text-mute); cursor: pointer; list-style: none; user-select: none; }
.review-panel details > summary::-webkit-details-marker { display: none; }
.review-panel details > summary::before { content: '▶ '; font-size: 8px; }
.review-panel details[open] > summary::before { content: '▼ '; }
.review-body { padding: 10px 12px; font-family: "JetBrains Mono", monospace; font-size: 11px; line-height: 1.6; color: var(--text-dim); white-space: pre-wrap; border-top: 1px solid var(--border); }

/* ===== SETTINGS ===== */
details.settings {
  background: var(--surface);
  border: 1px solid var(--border);
  margin-bottom: 20px;
}
details.settings > summary {
  padding: 13px 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: "JetBrains Mono", monospace;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--text);
  list-style: none;
  user-select: none;
}
details.settings > summary::-webkit-details-marker { display: none; }
details.settings > summary::before {
  content: '▶';
  font-size: 9px;
  color: var(--text-mute);
  transition: transform .2s;
  display: inline-block;
}
details[open].settings > summary::before { transform: rotate(90deg); }
.settings-body { padding: 0 18px 18px; border-top: 1px solid var(--border); }
.settings-grid { display: grid; grid-template-columns: 130px 1fr auto; gap: 8px 10px; align-items: center; padding-top: 14px; }
.settings-grid label {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--text-dim);
}
select, input[type=text], input[type=password], textarea {
  font: inherit;
  font-size: 13.5px;
  border: 1px solid var(--border-hi);
  border-radius: 0;
  padding: 7px 10px;
  width: 100%;
  background: var(--bg);
  color: var(--text);
  outline: none;
  -webkit-appearance: none;
}
select:focus, input:focus, textarea:focus {
  border-color: var(--text);
}
.clear-btn {
  background: none;
  border: 1px solid var(--border-hi);
  padding: 7px 10px;
  font: inherit;
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  color: var(--text-dim);
  white-space: nowrap;
}
.clear-btn:hover { border-color: var(--red); color: var(--red); }
.danger-zone { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 14px; }

/* ===== SLOT CARDS ===== */
.slot {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border-hi);
  padding: 16px 18px;
  margin-bottom: 10px;
}
.slot-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.slot-num {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--text-mute);
  background: var(--surface-hi);
  border: 1px solid var(--border-hi);
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.slot-title {
  font-family: "JetBrains Mono", monospace;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 1.2px;
  color: var(--text);
}
.slot-remove {
  margin-left: auto;
  background: none;
  border: 1px solid transparent;
  cursor: pointer;
  color: var(--text-mute);
  font-size: 18px;
  line-height: 1;
  padding: 2px 7px;
  font-family: monospace;
}
.slot-remove:hover { color: var(--red); border-color: var(--red); }
.field { margin-bottom: 10px; }
.field:last-child { margin-bottom: 0; }
.field > label {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--text-dim);
  display: block;
  margin-bottom: 5px;
}
.hint { color: var(--text-mute); font-weight: 400; font-size: 10px; margin-left: 6px; }
.url-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.fetch-btn {
  padding: 0 14px;
  background: var(--bg);
  border: 1px solid var(--border-hi);
  color: var(--text);
  font: inherit;
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  white-space: nowrap;
}
.fetch-btn:hover { border-color: var(--text); }
.fetch-btn:disabled { opacity: 0.4; cursor: not-allowed; }
textarea.slot-text { min-height: 120px; resize: vertical; font-size: 13px; }

.add-slot {
  width: 100%;
  background: transparent;
  border: 1px dashed var(--border-hi);
  padding: 12px;
  cursor: pointer;
  font: inherit;
  font-family: "JetBrains Mono", monospace;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--text-mute);
  margin-bottom: 18px;
  transition: border-color .15s, color .15s;
}
.add-slot:hover { border-color: var(--text); color: var(--text); }
.add-slot:disabled { opacity: 0.35; cursor: not-allowed; }

/* ===== ACTION BAR ===== */
.actions {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 24px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
}
.btn-primary {
  padding: 11px 22px;
  font: inherit;
  font-family: "JetBrains Mono", monospace;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 1.5px;
  border-radius: 0;
  cursor: pointer;
  background: var(--invert-btn-bg);
  color: var(--invert-btn-fg);
  border: 1px solid var(--invert-btn-bg);
}
.btn-primary:hover { opacity: 0.85; }
.btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-secondary {
  padding: 11px 22px;
  font: inherit;
  font-family: "JetBrains Mono", monospace;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 1.5px;
  border-radius: 0;
  cursor: pointer;
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border-hi);
}
.btn-secondary:hover { border-color: var(--text); }

/* ===== GEN STATUS ===== */
.gen-status {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--red);
  padding: 14px 18px;
  margin-bottom: 16px;
  display: none;
}
.gen-status.active { display: block; }
.gen-status-title {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--text-dim);
  margin-bottom: 10px;
}
.gen-list { list-style: none; padding: 0; margin: 0; font-size: 13px; }
.gen-list li {
  padding: 4px 0;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-dim);
  font-family: "JetBrains Mono", monospace;
  font-size: 10.5px;
  letter-spacing: 0.5px;
}
.gen-list li.done { color: var(--green); }
.gen-list li.fail { color: var(--red); }

/* ===== VIEW TOGGLE ===== */
.view-input { display: block; }
.view-edit { display: none; }
body.view-edit-mode .view-input { display: none; }
body.view-edit-mode .view-edit { display: block; }

/* ===== TWIN PANE ===== */
.twin-pane { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pane { background: var(--surface); border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; }
.pane-header {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface-hi);
  flex-shrink: 0;
}
.pane-label {
  font-family: "JetBrains Mono", monospace;
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 1.5px;
  color: var(--text);
}
.pane-url {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  color: var(--text-mute);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
.pane-body { padding: 14px; flex: 1; }
.pane-source {
  white-space: pre-wrap;
  font-size: 12.5px;
  line-height: 1.65;
  color: var(--text-dim);
  max-height: 480px;
  overflow-y: auto;
  font-family: "JetBrains Mono", monospace;
}
textarea.meldung-edit {
  width: 100%;
  min-height: 280px;
  resize: vertical;
  font-size: 14px;
  line-height: 1.7;
  border: 1px solid var(--border-hi);
  border-radius: 0;
  padding: 12px 14px;
  font-family: Georgia, "Times New Roman", serif;
  color: var(--text);
  background: var(--bg);
}
.char-count {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  color: var(--text-mute);
  margin-top: 5px;
  text-align: right;
  letter-spacing: 0.5px;
}
.regen-row { display: flex; gap: 8px; margin-top: 10px; }
.regen-input { flex: 1; }

/* ===== SLOT TABS ===== */
.slot-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.slot-tab {
  padding: 12px 18px;
  border: 0;
  background: transparent;
  color: var(--text-mute);
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.2px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color .15s, border-color .15s;
  -webkit-tap-highlight-color: transparent;
}
.slot-tab:hover { color: var(--text); }
.slot-tab.active { color: var(--text); border-bottom-color: var(--red); }
.slot-tab.has-result::after { content: ' ✓'; font-size: 9px; opacity: 0.85; }

.edit-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }

/* ===== FLASH ===== */
.flash {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--text);
  color: var(--bg);
  padding: 10px 18px;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  opacity: 0;
  transition: opacity .15s;
  pointer-events: none;
  z-index: 100;
  max-width: 90%;
  text-align: center;
}
.flash.show { opacity: 1; }
.flash.success { background: var(--green); color: #fff; }
.flash.error { background: var(--red); color: #fff; }

/* ===== FOOTER ===== */
footer {
  max-width: 1320px;
  margin: 36px auto 0;
  text-align: center;
  font-family: "JetBrains Mono", monospace;
  font-size: 9.5px;
  letter-spacing: 1px;
  color: var(--text-mute);
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
  .twin-pane { grid-template-columns: 1fr; }
  .settings-grid { grid-template-columns: 1fr 1fr auto; }
}
@media (max-width: 600px) {
  .page { padding: 16px 14px 60px; }
  .masthead { padding: 10px 14px; }
}
</style>
</head>
<body>

<!-- MASTHEAD -->
<div class="masthead">
  <div class="masthead-brand">
    <div class="masthead-dot"></div>
    <div>
      <div class="masthead-wordmark">MELDUNGSTOOL</div>
      <div class="masthead-sub">PRESSEMITTEILUNGEN → KURZMELDUNGEN</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:14px;">
    <span id="key-badge" class="badge red"><span class="pip"></span>SCHLÜSSEL FEHLT</span>
    <div class="theme-switch">
      <button id="btn-light" class="on">HELL</button>
      <button id="btn-dark">DUNKEL</button>
    </div>
  </div>
</div>

<div class="page">

  <!-- Settings -->
  <details class="settings" id="settings-panel">
    <summary>
      EINSTELLUNGEN
    </summary>
    <div class="settings-body">
      <div class="settings-grid">
        <label>ANBIETER</label>
        <select id="provider-select">
          <option value="anthropic">Claude (Anthropic)</option>
          <option value="openai">ChatGPT (OpenAI)</option>
          <option value="google">Gemini (Google)</option>
        </select>
        <div></div>

        <label>MODELL</label>
        <select id="model-select"></select>
        <div></div>

        <label>CLAUDE-KEY</label>
        <input type="password" id="key-anthropic" placeholder="sk-ant-…" autocomplete="off">
        <button class="clear-btn" data-clear="anthropic">LÖSCHEN</button>

        <label>OPENAI-KEY</label>
        <input type="password" id="key-openai" placeholder="sk-…" autocomplete="off">
        <button class="clear-btn" data-clear="openai">LÖSCHEN</button>

        <label>GOOGLE-KEY</label>
        <input type="password" id="key-google" placeholder="AIza…" autocomplete="off">
        <button class="clear-btn" data-clear="google">LÖSCHEN</button>
      </div>
      <div class="danger-zone">
        <button class="clear-btn" id="clear-all-btn">ALLE BROWSER-DATEN LÖSCHEN</button>
      </div>
    </div>
  </details>

  <!-- Input view -->
  <div class="view-input">
    <div id="slots-container"></div>
    <button class="add-slot" id="add-slot-btn">+ QUELLE HINZUFÜGEN (MAX. 5)</button>
    <div class="actions">
      <button class="btn-primary" id="generate-btn">MELDUNGEN GENERIEREN</button>
      <button class="btn-secondary" id="reset-btn">ZURÜCKSETZEN</button>
    </div>
  </div>

  <!-- Generation status -->
  <div class="gen-status" id="gen-status">
    <div class="gen-status-title">GENERIERUNG LÄUFT…</div>
    <ul class="gen-list" id="gen-list"></ul>
  </div>

  <!-- Result / edit view -->
  <div class="view-edit">
    <div class="edit-actions">
      <button class="btn-secondary" id="back-btn">← ZURÜCK</button>
      <button class="btn-primary" id="copy-btn">KOPIEREN</button>
      <button class="btn-secondary" id="regen-btn">NEU GENERIEREN</button>
    </div>
    <div class="slot-tabs" id="slot-tabs"></div>
    <div class="twin-pane">
      <!-- Left: original -->
      <div class="pane">
        <div class="pane-header">
          <span class="pane-label">ORIGINAL</span>
          <span class="pane-url" id="source-url"></span>
        </div>
        <div class="pane-body">
          <div class="pane-source" id="source-text"></div>
        </div>
      </div>
      <!-- Right: result -->
      <div class="pane">
        <div class="pane-header">
          <span class="pane-label">MELDUNG</span>
          <span class="char-count" id="char-count" style="margin:0;"></span>
        </div>
        <div class="pane-body">
          <textarea class="meldung-edit" id="meldung-edit" placeholder="Hier erscheint die generierte Meldung…"></textarea>
          <div id="review-panel"></div>
          <div class="regen-row">
            <input type="text" class="regen-input" id="regen-hint" placeholder="Anweisung für Neu-Generierung (optional)…">
          </div>
        </div>
      </div>
    </div>
  </div>

</div><!-- /page -->

<div class="flash" id="flash"></div>

<footer>MELDUNGSTOOL &mdash; TEXTE UND API-KEYS WERDEN AUSSCHLIESSLICH LOKAL IN DIESEM BROWSER GESPEICHERT.</footer>

<script>
/* ============================================================
   Config
============================================================ */
const STORAGE_KEY = 'meldungstool_v1';
const MAX_SLOTS = 5;

const MODELS = {
  anthropic: [
    { id: 'claude-sonnet-4-6',          label: 'Claude Sonnet 4.6 (empfohlen)' },
    { id: 'claude-haiku-4-5-20251001',  label: 'Claude Haiku 4.5 (günstig)' },
    { id: 'claude-opus-4-7',            label: 'Claude Opus 4.7 (leistungsstark)' }
  ],
  openai: [
    { id: 'gpt-4.1-mini', label: 'GPT-4.1 mini (günstig, empfohlen)' },
    { id: 'gpt-4.1',      label: 'GPT-4.1 (leistungsstark)' }
  ],
  google: [
    { id: 'gemini-2.5-flash', label: 'Gemini 2.5 Flash (günstig, empfohlen)' },
    { id: 'gemini-2.5-pro',   label: 'Gemini 2.5 Pro (leistungsstark)' }
  ]
};

const SYSTEM_PROMPTS = {
  meldung: `Du bist Redaktionsassistenz für eine Schweizer Lokalredaktion. Aus der Pressemitteilung schreibst Du eine klassische Kurzmeldung im Nachrichtenstil.

DEFINITION NACHRICHT
Die Meldung beantwortet:
- WER ist beteiligt?
- WAS ist geschehen?
- WANN ist es geschehen?
- WO ist es geschehen?
- WIE ist es geschehen?

GRUNDREGELN
- Reine Fakten ohne persönliche Meinungen oder Wertungen.
- Kurze, klare, leicht verständliche Sätze.
- Tempus: Präsens (Gegenwart) oder Präteritum (Vergangenheit).

Die Meldung ist so gebaut, dass sie theoretisch nach jedem Satz abgeschnitten werden könnte, ohne dass wichtige Information verloren geht. Das Wichtigste steht vorne, jeder weitere Satz ergänzt, ist aber nicht zwingend für das Verständnis des Vorhergehenden.

SPRACHE

2. Keine tautologischen Beiwörter.
3. Füllwörter und Worthülsen vermeiden.`,

const REVIEW_PROMPT = `Vergleiche den Eingabetext mit dem generierten Artikel.
Bewerte, ob alle wesentlichen Informationen korrekt übernommen wurden und ob nicht im Eingabetext vorhandene Informationen erfunden wurden.

VORGEHENSWEISE:
1. Vollständigkeit: Sind alle relevanten Infos aus dem Eingabetext im Artikel?
2. Genauigkeit: Wurde der Inhalt korrekt wiedergegeben?
3. Halluzinationen: Wurden Inhalte erfunden, die nicht im Eingabetext stehen?

AUSGABE (exakt dieses Format, nichts anderes):
BEWERTUNG: [Zahl 1-5]
BEGRÜNDUNG: [2-4 Sätze Analyse]

Skala:
1 = Sehr schlecht (viele Fehler oder Erfindungen)
2 = Unzureichend (mehrere Auslassungen oder Fehler)
3 = Mittelmässig (kleinere Fehler oder Ergänzungen)
4 = Gut (fast vollständig korrekt)
5 = Sehr gut (vollständige, korrekte Übereinstimmung)`;

/* ============================================================
   State
============================================================ */
let state = {
  provider: 'anthropic',
  model: 'claude-sonnet-4-6',
  keys: { anthropic: '', openai: '', google: '' },
  slots: [],
  activeSlot: 0
};

function newSlot() {
  return { id: Date.now() + Math.random(), url: '', text: '', focus: '', meldung: '',
           type: 'meldung', reviewScore: null, reviewText: '', wasRetried: false };
}

/* ============================================================
   Persistence
============================================================ */
function persist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    provider: state.provider,
    model: state.model,
    keys: state.keys
  }));
}

function persistSlots() {
  localStorage.setItem(STORAGE_KEY + '_slots', JSON.stringify(state.slots));
}

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    state.provider = d.provider || 'anthropic';
    state.model    = d.model || MODELS[state.provider][0].id;
    state.keys     = Object.assign({ anthropic: '', openai: '', google: '' }, d.keys || {});
  } catch(e) {}
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY + '_slots') || '[]');
    state.slots = s.length ? s : [newSlot()];
  } catch(e) {
    state.slots = [newSlot()];
  }
}

/* ============================================================
   Escape HTML
============================================================ */
function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ============================================================
   Render slots (input view)
============================================================ */
function renderSlots() {
  const container = document.getElementById('slots-container');
  container.innerHTML = '';
  state.slots.forEach((slot, i) => {
    const div = document.createElement('div');
    div.className = 'slot';
    div.innerHTML = `
      <div class="slot-header">
        <span class="slot-num">${i + 1}</span>
        <span class="slot-title">QUELLE ${i + 1}</span>
        ${state.slots.length > 1 ? '<button class="slot-remove" title="Entfernen">&times;</button>' : ''}
      </div>
      <div class="field">
        <label>TYP <span class="hint">beeinflusst Stil und Struktur</span></label>
        <select class="slot-type">
          <option value="meldung"${slot.type === 'meldung' ? ' selected' : ''}>Meldung (Standard)</option>
          <option value="vorschau"${slot.type === 'vorschau' ? ' selected' : ''}>Vorschau / Ankündigung</option>
          <option value="bericht"${slot.type === 'bericht' ? ' selected' : ''}>Bericht (Vergangenes)</option>
          <option value="rezension"${slot.type === 'rezension' ? ' selected' : ''}>Rezension</option>
        </select>
      </div>
      <div class="field">
        <label>URL <span class="hint">optional – für die Quellenangabe</span></label>
        <div class="url-row">
          <input type="text" class="slot-url" value="${esc(slot.url)}" placeholder="https://…">
          <button class="fetch-btn">TEXT LADEN</button>
        </div>
      </div>
      <div class="field">
        <label>TEXT DER PRESSEMITTEILUNG <span class="hint">einfügen oder oben laden</span></label>
        <textarea class="slot-text">${esc(slot.text)}</textarea>
      </div>
      <div class="field">
        <label>FOKUS / AKZENT <span class="hint">optional – was soll hervorgehoben werden?</span></label>
        <input type="text" class="slot-focus" value="${esc(slot.focus)}" placeholder="z.B. Konsequenzen für den Kanton">
      </div>
    `;
    div.querySelector('.slot-type').addEventListener('change', e => { slot.type = e.target.value; persistSlots(); });
    div.querySelector('.slot-url').addEventListener('input', e => { slot.url = e.target.value; persistSlots(); });
    div.querySelector('.slot-text').addEventListener('input', e => { slot.text = e.target.value; persistSlots(); });
    div.querySelector('.slot-focus').addEventListener('input', e => { slot.focus = e.target.value; persistSlots(); });
    div.querySelector('.fetch-btn').addEventListener('click', () => tryFetchSlot(i, div));
    if (state.slots.length > 1) {
      div.querySelector('.slot-remove').addEventListener('click', () => {
        state.slots.splice(i, 1);
        if (state.activeSlot >= state.slots.length) state.activeSlot = state.slots.length - 1;
        persistSlots();
        renderSlots();
      });
    }
    container.appendChild(div);
  });
  document.getElementById('add-slot-btn').disabled = state.slots.length >= MAX_SLOTS;
}

/* ============================================================
   URL fetch (best-effort, CORS often blocks)
============================================================ */
async function tryFetchSlot(idx, el) {
  const slot = state.slots[idx];
  const url  = slot.url.trim();
  if (!url) { flash('Bitte zuerst eine URL eintragen.', 'error'); return; }
  const btn = el.querySelector('.fetch-btn');
  btn.disabled = true; btn.textContent = 'LADE…';
  try {
    const res = await fetch(url, { method: 'GET', redirect: 'follow' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const html = await res.text();
    const text = extractText(html);
    if (text.length < 80) throw new Error('Zu wenig Text gefunden');
    slot.text = text;
    el.querySelector('.slot-text').value = text;
    persistSlots();
    flash('Text geladen (' + text.length + ' Zeichen). Bitte prüfen.', 'success');
  } catch(e) {
    flash('URL konnte nicht geladen werden (meist CORS). Bitte Text manuell einfügen.', 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'TEXT LADEN';
  }
}

function extractText(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script, style, nav, header, footer, aside, noscript').forEach(n => n.remove());
  const selectors = ['main', 'article', '[role=main]', '.content', '#content', '.main', '#main'];
  let root = null;
  for (const sel of selectors) {
    const el = doc.querySelector(sel);
    if (el && el.textContent.trim().length > 200) { root = el; break; }
  }
  if (!root) root = doc.body;
  return (root.textContent || '')
    .replace(/[ \t]+/g, ' ')
    .replace(/\s*\n\s*/g, '\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

/* ============================================================
   API calls
============================================================ */
function buildUserMessage(slot) {
  let s = 'URL der Pressemitteilung: ' + (slot.url.trim() || '(keine URL angegeben)') + '\n\n';
  if (slot.focus && slot.focus.trim()) s += 'Fokus / Akzent: ' + slot.focus.trim() + '\n\n';
  s += 'Originaltext der Pressemitteilung:\n\n' + slot.text.trim();
  return s;
}

async function callAnthropic(system, user, key, model) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'content-type': 'application/json'
    },
    body: JSON.stringify({
      model,
      max_tokens: 800,
      temperature: 0.5,
      system,
      messages: [{ role: 'user', content: user }]
    })
  });
  if (!res.ok) { const t = await res.text(); throw new Error('Anthropic ' + res.status + ': ' + t.slice(0, 220)); }
  const d = await res.json();
  return (d.content?.[0]?.text || '').trim();
}

async function callOpenAI(system, user, key, model) {
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'authorization': 'Bearer ' + key, 'content-type': 'application/json' },
    body: JSON.stringify({
      model,
      max_tokens: 800,
      temperature: 0.5,
      messages: [{ role: 'system', content: system }, { role: 'user', content: user }]
    })
  });
  if (!res.ok) { const t = await res.text(); throw new Error('OpenAI ' + res.status + ': ' + t.slice(0, 220)); }
  const d = await res.json();
  return (d.choices?.[0]?.message?.content || '').trim();
}

async function callGoogle(system, user, key, model) {
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/'
    + encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(key);
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({
      contents: [{ role: 'user', parts: [{ text: user }] }],
      systemInstruction: { parts: [{ text: system }] },
      generationConfig: { maxOutputTokens: 800, temperature: 0.5 }
    })
  });
  if (!res.ok) { const t = await res.text(); throw new Error('Google ' + res.status + ': ' + t.slice(0, 220)); }
  const d = await res.json();
  return (d.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('').trim();
}

async function callProvider(system, user) {
  const key = state.keys[state.provider];
  if (!key) throw new Error('Kein API-Schlüssel hinterlegt');
  if (state.provider === 'anthropic') return callAnthropic(system, user, key, state.model);
  if (state.provider === 'openai')    return callOpenAI(system, user, key, state.model);
  if (state.provider === 'google')    return callGoogle(system, user, key, state.model);
  throw new Error('Unbekannter Provider');
}

async function generateOne(slot, hint = '') {
  const system = SYSTEM_PROMPTS[slot.type] || SYSTEM_PROMPTS.meldung;
  let user = buildUserMessage(slot);
  if (hint && hint.trim()) user += '\n\nZusätzliche Anweisung: ' + hint.trim();
  return callProvider(system, user);
}

async function reviewOne(slot, generatedText) {
  const user = 'EINGABETEXT:\n' + slot.text.trim()
    + '\n\n---\nGENERIERTER ARTIKEL:\n' + generatedText;
  const raw = await callProvider(REVIEW_PROMPT, user);
  const match = raw.match(/BEWERTUNG:\s*([1-5])/);
  const score = match ? parseInt(match[1]) : 3;
  return { score, text: raw };
}

async function generateWithReview(slot, hint = '') {
  let result = await generateOne(slot, hint);
  const review = await reviewOne(slot, result);
  slot.reviewScore = review.score;
  slot.reviewText  = review.text;
  slot.wasRetried  = false;
  if (review.score < 4) {
    const retryHint = 'Erster Entwurf:\n' + result
      + '\n\nSelbstkritik:\n' + review.text
      + '\n\nBitte verbessere den Artikel entsprechend.';
    result = await generateOne(slot, retryHint);
    slot.wasRetried = true;
  }
  return result;
}

/* ============================================================
   Generate all
============================================================ */
async function generateAll() {
  const filled = state.slots.filter(s => s.text.trim().length > 20);
  if (!filled.length) { flash('Bitte mindestens einen Text einfügen.', 'error'); return; }
  if (!state.keys[state.provider]) {
    flash('Bitte zuerst API-Key hinterlegen.', 'error');
    document.getElementById('settings-panel').open = true;
    return;
  }

  const genStatus = document.getElementById('gen-status');
  const genList   = document.getElementById('gen-list');
  genStatus.classList.add('active');
  genList.innerHTML = filled.map((slot, i) =>
    `<li id="gl-${i}">⏳ Quelle ${state.slots.indexOf(slot) + 1}…</li>`
  ).join('');
  document.getElementById('generate-btn').disabled = true;

  for (let i = 0; i < filled.length; i++) {
    const slot = filled[i];
    const li   = document.getElementById('gl-' + i);
    const num  = state.slots.indexOf(slot) + 1;
    try {
      li.textContent = '⏳ Quelle ' + num + ' — Generierung…';
      slot.reviewScore = null; slot.reviewText = ''; slot.wasRetried = false;
      const first = await generateOne(slot);
      li.textContent = '⏳ Quelle ' + num + ' — Selbstkritik…';
      const review = await reviewOne(slot, first);
      slot.reviewScore = review.score;
      slot.reviewText  = review.text;
      slot.wasRetried  = false;
      let result = first;
      if (review.score < 4) {
        li.textContent = '⏳ Quelle ' + num + ' — Überarbeitung…';
        const retryHint = 'Erster Entwurf:\n' + first
          + '\n\nSelbstkritik:\n' + review.text
          + '\n\nBitte verbessere den Artikel entsprechend.';
        result = await generateOne(slot, retryHint);
        slot.wasRetried = true;
      }
      slot.meldung = result;
      li.textContent = '✓ Quelle ' + num + ' fertig (Score: ' + review.score + '/5' + (slot.wasRetried ? ', überarbeitet' : '') + ')';
      li.className = 'done';
    } catch(e) {
      li.textContent = '✗ Quelle ' + num + ': ' + e.message;
      li.className = 'fail';
    }
    persistSlots();
  }

  document.getElementById('generate-btn').disabled = false;
  setTimeout(() => genStatus.classList.remove('active'), 1800);

  state.activeSlot = state.slots.indexOf(filled[0]);
  showEditView();
}

   Edit / result view
============================================================ */
function showEditView() {
  document.body.classList.add('view-edit-mode');
  renderTabs();
  renderActiveSlot();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderTabs() {
  const container = document.getElementById('slot-tabs');
  container.innerHTML = '';
  state.slots.forEach((slot, i) => {
    if (!slot.text.trim()) return;
    const btn = document.createElement('button');
    btn.className = 'slot-tab'
      + (i === state.activeSlot ? ' active' : '')
      + (slot.meldung ? ' has-result' : '');
    btn.textContent = 'QUELLE ' + (i + 1);
    btn.addEventListener('click', () => {
      state.activeSlot = i;
      renderTabs();
      renderActiveSlot();
    });
    container.appendChild(btn);
  });
}

function renderActiveSlot() {
  const slot = state.slots[state.activeSlot];
  if (!slot) return;
  document.getElementById('source-url').textContent  = slot.url || '';
  document.getElementById('source-text').textContent = slot.text;
  document.getElementById('meldung-edit').value       = slot.meldung || '';
  document.getElementById('regen-hint').value         = '';
  updateCharCount();
  renderReview(slot);
}

function renderReview(slot) {
  const panel = document.getElementById('review-panel');
  if (!slot || !slot.reviewScore) { panel.innerHTML = ''; return; }
  const color   = slot.reviewScore >= 4 ? 'green' : 'red';
  const retried = slot.wasRetried
    ? '<span class="badge muted" style="font-size:9px;">ÜBERARBEITET</span>' : '';
  panel.innerHTML = `
    <div class="review-header">
      <span class="review-label">SELBSTKRITIK</span>
      <span class="badge ${color}"><span class="pip"></span>${slot.reviewScore}/5</span>
      ${retried}
    </div>
    <details>
      <summary>Begründung anzeigen</summary>
      <div class="review-body">${esc(slot.reviewText)}</div>
    </details>`;
}

function updateCharCount() {
  const val = document.getElementById('meldung-edit').value;
  document.getElementById('char-count').textContent = val ? val.length + ' ZCH' : '';
}

/* ============================================================
   Regenerate
============================================================ */
async function regenerateActive() {
  const slot = state.slots[state.activeSlot];
  if (!slot) return;
  if (!state.keys[state.provider]) { flash('Kein API-Key hinterlegt.', 'error'); return; }
  const btn  = document.getElementById('regen-btn');
  const hint = document.getElementById('regen-hint').value;
  btn.disabled = true; btn.textContent = 'GENERIERE…';
  try {
    slot.reviewScore = null; slot.reviewText = ''; slot.wasRetried = false;
    btn.textContent = 'GENERIERUNG…';
    const first = await generateOne(slot, hint);
    btn.textContent = 'SELBSTKRITIK…';
    const review = await reviewOne(slot, first);
    slot.reviewScore = review.score;
    slot.reviewText  = review.text;
    let result = first;
    if (review.score < 4) {
      btn.textContent = 'ÜBERARBEITUNG…';
      const retryHint = 'Erster Entwurf:\n' + first
        + '\n\nSelbstkritik:\n' + review.text
        + '\n\nBitte verbessere den Artikel entsprechend.';
      result = await generateOne(slot, retryHint);
      slot.wasRetried = true;
    }
    slot.meldung = result;
    persistSlots();
    document.getElementById('meldung-edit').value = result;
    updateCharCount();
    renderReview(slot);
    flash('Neu generiert (Score: ' + review.score + '/5).', 'success');
  } catch(e) {
    flash('Fehler: ' + e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'NEU GENERIEREN';
  }
}

   Copy
============================================================ */
function copyActive() {
  const text = document.getElementById('meldung-edit').value;
  if (!text) { flash('Nichts zu kopieren.', 'error'); return; }
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text)
      .then(() => flash('Kopiert!', 'success'))
      .catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); flash('Kopiert!', 'success'); }
  catch(e) { flash('Kopieren fehlgeschlagen.', 'error'); }
  ta.remove();
}

  document.getElementById('key-openai').value    = state.keys.openai;
  document.getElementById('key-google').value    = state.keys.google;
  updateKeyBadge();

  document.getElementById('provider-select').addEventListener('change', e => {
    state.provider = e.target.value; renderModelSelect(); persist(); updateKeyBadge();
  });
  document.getElementById('model-select').addEventListener('change', e => {
    state.model = e.target.value; persist();
  });
  ['anthropic', 'openai', 'google'].forEach(p => {
    document.getElementById('key-' + p).addEventListener('input', e => {
      state.keys[p] = e.target.value.trim(); persist(); updateKeyBadge();
    });
  });
  document.querySelectorAll('.clear-btn[data-clear]').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = btn.dataset.clear;
      state.keys[p] = ''; document.getElementById('key-' + p).value = '';
      persist(); updateKeyBadge();
    });
  });
  document.getElementById('clear-all-btn').addEventListener('click', () => {
    if (!confirm('Wirklich alle Daten löschen (Keys, Eingaben, Meldungen)?')) return;
    Object.keys(localStorage)
      .filter(k => k.startsWith('meldungstool_'))
      .forEach(k => localStorage.removeItem(k));
    location.reload();
  });
}

/* ============================================================
   Theme
============================================================ */
function initTheme() {
  const saved = localStorage.getItem('meldungstool_theme') || 'light';
  applyTheme(saved);
  document.getElementById('btn-light').addEventListener('click', () => applyTheme('light'));
  document.getElementById('btn-dark').addEventListener('click',  () => applyTheme('dark'));
}

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('meldungstool_theme', t);
  document.getElementById('btn-light').classList.toggle('on', t === 'light');
  document.getElementById('btn-dark').classList.toggle('on', t === 'dark');
}

/* ============================================================
   Wire up
============================================================ */
function init() {
  load();
  initTheme();
  initSettings();
  renderSlots();

  document.getElementById('add-slot-btn').addEventListener('click', () => {
    if (state.slots.length >= MAX_SLOTS) return;
    state.slots.push(newSlot()); persistSlots(); renderSlots();
  });

  document.getElementById('generate-btn').addEventListener('click', generateAll);

  document.getElementById('reset-btn').addEventListener('click', () => {
    if (!confirm('Alle Eingaben und generierten Meldungen löschen?')) return;
    state.slots = [newSlot()]; state.activeSlot = 0;
    persistSlots(); renderSlots();
    document.body.classList.remove('view-edit-mode');
  });

  document.getElementById('back-btn').addEventListener('click', () => {
    document.body.classList.remove('view-edit-mode');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  document.getElementById('meldung-edit').addEventListener('input', e => {
    const slot = state.slots[state.activeSlot];
    if (slot) { slot.meldung = e.target.value; persistSlots(); }
    updateCharCount();
  });

  document.getElementById('copy-btn').addEventListener('click', copyActive);
  document.getElementById('regen-btn').addEventListener('click', regenerateActive);

  if (!state.keys[state.provider]) document.getElementById('settings-panel').open = true;
}

document.addEventListener('DOMContentLoaded', init);
</script>
