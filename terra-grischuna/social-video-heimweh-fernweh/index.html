<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<title>Terra Grischuna 5/2026 – Social Flipbook</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
  :root { --red:#BC180F; --paper:#fbfaf7; }
  html,body { margin:0; padding:0; overflow:hidden; background:#000; }
  #stage { position:relative; overflow:hidden; perspective:3200px;
    background: radial-gradient(120% 80% at 50% 45%, #3a3632 0%, #1f1d1b 55%, #0e0d0c 100%); }
  #book { position:absolute; left:0; top:0; transform-origin:0 0; }
  .page { position:absolute; top:0; background-size:100% 100%; background-color:var(--paper); }
  .page::after { content:""; position:absolute; inset:0; pointer-events:none; }
  .page.right::after { background: linear-gradient(to right, rgba(0,0,0,.20), rgba(0,0,0,.05) 40px, rgba(0,0,0,0) 90px); }
  .page.left::after  { background: linear-gradient(to left,  rgba(0,0,0,.20), rgba(0,0,0,.05) 40px, rgba(0,0,0,0) 90px); }
  .castshadow { position:absolute; inset:0; pointer-events:none; }
  #bookshadow { position:absolute; top:0; border-radius:6px; background:rgba(0,0,0,.55); filter:blur(38px); }
  .leafwrap { position:absolute; top:0; pointer-events:none; }
  .leaf, .strip { position:absolute; top:0; transform-style:preserve-3d; transform-origin:0 50%; }
  .face { position:absolute; top:0; left:0; height:100%; backface-visibility:hidden; -webkit-backface-visibility:hidden; background-repeat:no-repeat; background-color:var(--paper); }
  .face.back { transform:rotateY(180deg); }
  .face .shade { position:absolute; inset:0; background:#000; opacity:0; }
  .face .gut { position:absolute; inset:0; }
  #anchor { position:absolute; left:0; top:0; }
  .ring { position:absolute; border-radius:50%; border:4px solid var(--red); box-sizing:border-box; }
  .glow { position:absolute; border-radius:50%; background: radial-gradient(circle, rgba(255,60,40,.55), rgba(255,60,40,0) 70%); }
  #fx { position:absolute; inset:0; pointer-events:none; }
  .card { position:absolute; transform-origin:0 0; box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 8px 24px rgba(0,0,0,.35); }
  .scrim { position:absolute; left:0; right:0; pointer-events:none; }
  .cap { position:absolute; color:#fff; z-index:8; }
  .kicker { font-family:'Barlow Semi Condensed',sans-serif; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
  .serif { font-family:'Source Serif 4',serif; }
  .w { display:inline-block; will-change:transform; }
  .pill { display:inline-block; background:var(--red); color:#fff; border-radius:999px; }
</style>
</head>
<body>
<div id="stage">
  <div id="book">
    <div id="bookshadow"></div>
    <div id="leftStack" class="page left"><div class="castshadow" id="lshadow"></div></div>
    <div id="rightStack" class="page right"><div class="castshadow" id="rshadow"></div></div>
    <div id="anchor"></div>
    <div id="leaves"></div>
  </div>
  <div id="fx"></div>
</div>
<script type="module">
// ===================================================================
//  Terra Grischuna 5|2026 – "Durchblättern" Social-Video
//  Deterministische Animation: window.render(t) zeichnet Frame zur Zeit t (Sek.).
//  Alle Texte stammen aus dem Heft (Revisions-PDF tg0526). Keine erfundenen Zahlen.
// ===================================================================
const Q = new URLSearchParams(location.search);
const W = +Q.get('w') || 1080, H = +Q.get('h') || 1920;
const FMT = H / W > 1.5 ? 'story' : 'feed';          // 9:16 oder 4:5
const PW = 1100, PH = Math.round(PW * 841.89 / 595.276); // A4-Proportion
const N_STRIP = 12, SW = PW / N_STRIP;

// PDF-Seiten in Heftreihenfolge. S. 49–52 = eingeheftete Abo-Karte -> übersprungen,
// danach gilt: PDF-Seite = Folio + 4.
const SEQ = [];
for (let p = 1; p <= 48; p++) SEQ.push(p);
for (let p = 53; p <= 68; p++) SEQ.push(p);
const NLEAF = SEQ.length / 2;              // 32 Blätter
const HI = new Set([1, 4, 8, 9, 14, 18, 27, 35]);   // in 300 dpi vorhanden
const pad = n => String(n).padStart(2, '0');
const webSrc = p => `pages/web/p-${pad(p)}.jpg`;
const hiSrc = p => HI.has(p) ? `pages/hi/h-${pad(p)}.jpg` : webSrc(p);

// ---------- Helfer ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const E = {
  lin: u => u,
  io: u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2,
  out: u => 1 - Math.pow(1 - u, 3),
  out5: u => 1 - Math.pow(1 - u, 5),
  in: u => u * u * u,
  ioS: u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2,
  back: u => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); },
};
const seg = (t, t0, t1, ease = E.io) => ease(clamp((t - t0) / (t1 - t0)));
// Ein-/Ausblend-Hüllkurve
const env = (t, t0, t1, fin = .4, fout = .4) => Math.min(seg(t, t0, t0 + fin, E.out), 1 - seg(t, t1 - fout, t1, E.in));
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

const geo = await (await fetch('geo.json')).json();

// ---------- Bilder vorladen ----------
const IMG = {};
async function load(src) {
  if (IMG[src]) return IMG[src];
  const im = new Image(); im.src = src; await im.decode(); IMG[src] = im; return im;
}
await Promise.all([...SEQ.map(p => load(webSrc(p))), ...[...HI].map(p => load(hiSrc(p))),
  load('assets/logo_white.png'), load('assets/p9chart_orig.png'), load('assets/p9chart_clean.png'),
  load('assets/p27chart_orig.png'), load('assets/p27chart_clean.png')]);
await document.fonts.load('800 40px "Barlow Semi Condensed"');
await document.fonts.load('700 40px "Barlow Semi Condensed"');
await document.fonts.load('500 40px "Barlow Semi Condensed"');
await document.fonts.load('600 40px "Source Serif 4"');
await document.fonts.load('italic 600 40px "Source Serif 4"');
await document.fonts.load('italic 500 40px "Source Serif 4"');

// ---------- DOM-Grundgerüst ----------
const $ = id => document.getElementById(id);
const stage = $('stage'), book = $('book'), leavesEl = $('leaves'), anchor = $('anchor'), fx = $('fx');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
const leftStack = $('leftStack'), rightStack = $('rightStack');
for (const el of [leftStack, rightStack]) { el.style.width = PW + 'px'; el.style.height = PH + 'px'; }
leftStack.style.left = -PW + 'px'; rightStack.style.left = '0px';
const bookshadow = $('bookshadow'); bookshadow.style.height = PH + 'px';

// ---------- Blätter (3D, in Streifen für die Papierwölbung) ----------
const leaves = [];
for (let k = 0; k < NLEAF; k++) {
  const front = SEQ[2 * k], back = SEQ[2 * k + 1];
  const wrap = document.createElement('div');
  wrap.className = 'leafwrap';
  Object.assign(wrap.style, { left: -PW + 'px', width: 2 * PW + 'px', height: PH + 'px',
    perspective: '2600px', perspectiveOrigin: `${PW}px ${PH * .5}px`, display: 'none' });
  const root = document.createElement('div');
  root.className = 'leaf';
  Object.assign(root.style, { left: PW + 'px', width: SW + 'px', height: PH + 'px' });
  wrap.appendChild(root);
  let parent = root; const strips = [];
  for (let j = 0; j < N_STRIP; j++) {
    const s = j === 0 ? root : document.createElement('div');
    if (j > 0) { s.className = 'strip'; Object.assign(s.style, { left: SW + 'px', width: SW + 'px', height: PH + 'px' }); parent.appendChild(s); }
    const f = document.createElement('div'); f.className = 'face front';
    Object.assign(f.style, { width: (SW + 1.2) + 'px', backgroundImage: `url(${webSrc(front)})`,
      backgroundSize: `${PW}px ${PH}px`, backgroundPosition: `${-j * SW}px 0` });
    const b = document.createElement('div'); b.className = 'face back';
    Object.assign(b.style, { width: (SW + 1.2) + 'px', backgroundImage: `url(${webSrc(back)})`,
      backgroundSize: `${PW}px ${PH}px`, backgroundPosition: `${-(PW - (j + 1) * SW)}px 0` });
    if (j === 0) {
      const g1 = document.createElement('div'); g1.className = 'gut';
      g1.style.background = 'linear-gradient(to right, rgba(0,0,0,.2), rgba(0,0,0,0) 80px)'; f.appendChild(g1);
      const g2 = document.createElement('div'); g2.className = 'gut';
      g2.style.background = 'linear-gradient(to left, rgba(0,0,0,.2), rgba(0,0,0,0) 80px)'; b.appendChild(g2);
    }
    const fs = document.createElement('div'); fs.className = 'shade'; f.appendChild(fs);
    const bs = document.createElement('div'); bs.className = 'shade'; b.appendChild(bs);
    s.appendChild(f); s.appendChild(b);
    strips.push({ el: s, fs, bs });
    parent = s;
  }
  leavesEl.appendChild(wrap);
  leaves.push({ k, front, back, wrap, root, strips, start: null, dur: 1 });
}

// ---------- Zeitplan: Blätter-Läufe ----------
// flip(t0, ab Blatt k0, Anzahl n, Dauer pro Blatt, Versatz)
function flip(t0, k0, n, dur = .9, stag = .3) {
  for (let i = 0; i < n; i++) { const L = leaves[k0 + i]; L.start = t0 + i * stag; L.dur = dur; }
  return t0 + (n - 1) * stag + dur;
}
const leafP = (L, t) => L.start === null ? 0 : clamp((t - L.start) / L.dur);

// ---------- Kamera ----------
// Buchkoordinaten: Falz bei x=0, rechte Seite x∈[0,PW], linke x∈[-PW,0]
const side = folio => folio % 2 === 0 ? -PW : 0;
const fitZ = (w, h, fw = .9, fh = .9) => Math.min(W * fw / w, H * fh / h);
function focus(folio, x0, y0, x1, y1, fw = .92, fh = .9, extra = {}) {
  const ox = side(folio);
  const z = fitZ((x1 - x0) * PW, (y1 - y0) * PH, fw, fh);
  const off = (extra.off ?? (FMT === 'story' ? .085 : .06)) * H / z;   // Platz für Textpanel oben
  return Object.assign({ x: ox + (x0 + x1) / 2 * PW, y: (y0 + y1) / 2 * PH - off, z, rx: 0, rz: 0 }, extra);
}
const pageView = (folio, extra = {}) => focus(folio, 0, 0, 1, 1, .9, FMT === 'story' ? .72 : .8, Object.assign({ off: .02 }, extra));
const flipView = (extra = {}) => Object.assign({ x: PW * .32, y: PH * .5, z: fitZ(PW * 1.25, PH, 1, FMT === 'story' ? .7 : .84), rx: 9, rz: 0 }, extra);

const camKeys = [];
const key = (t, v, ease = E.io) => camKeys.push(Object.assign({ t, ease }, v));
function camAt(t) {
  if (t <= camKeys[0].t) return camKeys[0];
  for (let i = 0; i < camKeys.length - 1; i++) {
    const a = camKeys[i], b = camKeys[i + 1];
    if (t >= a.t && t <= b.t) {
      const u = b.ease((t - a.t) / Math.max(1e-6, b.t - a.t));
      // Zoom logarithmisch interpolieren -> gleichmässige Bewegung
      return { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), z: Math.exp(lerp(Math.log(a.z), Math.log(b.z), u)),
        rx: lerp(a.rx || 0, b.rx || 0, u), rz: lerp(a.rz || 0, b.rz || 0, u) };
    }
  }
  return camKeys[camKeys.length - 1];
}
// Buchpunkt -> Bildschirm (nur bei rx=rz=0 exakt; Pop-Karten starten nur bei flacher Kamera)
const proj = (c, bx, by) => [W / 2 + (bx - c.x) * c.z, H / 2 + (by - c.y) * c.z];

// ---------- Textebenen ----------
const caps = [];
function el(tag, cls, html, parent = fx) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; parent.appendChild(e); return e; }
// Wörter einzeln einblenden
function words(text) { return text.split(' ').map(w => `<span class="w">${w}</span>`).join(' '); }
function caption({ panel = true, t0, t1, x = 48, y, w = W - 96, kicker, kickerColor = 'var(--red)', title, titleCls = 'serif', titleSize = 64, titleWeight = 600, titleStyle = 'normal', sub, subSize = 34, align = 'left', lh = 1.08, stag = .045, pill = false }) {
  const box = el('div', 'cap'); Object.assign(box.style, { left: x + 'px', top: y + 'px', textAlign: align });
  if (panel) Object.assign(box.style, { maxWidth: w + 'px', boxSizing: 'border-box', padding: '28px 34px 32px', background: 'rgba(16,14,12,.88)', borderLeft: '8px solid var(--red)', borderRadius: '3px', boxShadow: '0 20px 50px rgba(0,0,0,.35)' });
  else box.style.width = w + 'px';
  const parts = [];
  if (kicker) { const k = el('div', 'kicker' + (pill ? ' pill' : ''), words(kicker), box);
    Object.assign(k.style, { fontSize: '30px', color: pill ? '#fff' : kickerColor, marginBottom: '16px', padding: pill ? '8px 20px 6px' : '0' }); parts.push(k); }
  if (title) { const h = el('div', titleCls, words(title), box);
    Object.assign(h.style, { fontSize: titleSize + 'px', lineHeight: lh, fontWeight: titleWeight, fontStyle: titleStyle, textShadow: '0 2px 24px rgba(0,0,0,.45)' }); parts.push(h); }
  if (sub) { const s = el('div', 'serif', words(sub), box);
    Object.assign(s.style, { fontSize: subSize + 'px', lineHeight: 1.3, fontWeight: 500, fontStyle: 'italic', marginTop: '20px', color: 'rgba(255,255,255,.88)', textShadow: '0 2px 18px rgba(0,0,0,.5)' }); parts.push(s); }
  const ws = [...box.querySelectorAll('.w')];
  const c = { box, ws, t0, t1, stag, panel }; caps.push(c); return c;
}
function drawCaps(t) {
  for (const c of caps) {
    const vis = t >= c.t0 - .01 && t <= c.t1;
    c.box.style.display = vis ? 'block' : 'none'; if (!vis) continue;
    const out = seg(t, c.t1 - .35, c.t1, E.in);
    if (c.panel) { const pu = seg(t, c.t0 - .05, c.t0 + .3, E.out); c.box.style.opacity = (pu * (1 - out)).toFixed(3); c.box.style.clipPath = `inset(0 ${(1 - pu) * 100}% 0 0)`; }
    c.ws.forEach((w, i) => {
      const u = seg(t, c.t0 + i * c.stag, c.t0 + i * c.stag + .45, E.out);
      w.style.opacity = (u * (1 - out)).toFixed(3);
      w.style.transform = `translateY(${(1 - u) * 26 - out * 18}px)`;
      w.style.filter = u < 1 ? `blur(${(1 - u) * 6}px)` : 'none';
    });
  }
}
// Abdunkelungen für Lesbarkeit
const scrims = [];
function scrim(t0, t1, pos = 'top', size = .42, a = .78, force = false) {
  if (!force) return null;
  const s = el('div', 'scrim');
  s.style[pos] = '0'; s.style.height = Math.round(H * size) + 'px';
  s.style.background = `linear-gradient(to ${pos === 'top' ? 'bottom' : 'top'}, rgba(10,9,8,${a}), rgba(10,9,8,${a * .6}) 45%, rgba(10,9,8,0))`;
  scrims.push({ s, t0, t1 }); return s;
}
const dims = []; // Vollflächige Abdunkelung (für Pop-Karten)
function dim(t0, t1, a = .6) { const d = el('div', 'scrim'); d.style.top = '0'; d.style.height = H + 'px'; d.style.background = '#0b0a09'; dims.push({ d, t0, t1, a }); }

// ---------- Pop-Karten (Bild löst sich aus der Seite) ----------
const cards = [];
function card({ src, folio, r, t0, t1, to, radius = 4, draw, inDur = .9, outDur = .8, z = 5 }) {
  const cv = document.createElement('canvas'); cv.className = 'card'; cv.style.zIndex = z; fx.appendChild(cv);
  cards.push({ cv, ctx: cv.getContext('2d'), src, folio, r, t0, t1, to, radius, draw, inDur, outDur });
}
// Bild-Ausschnitt (normierte Seitenkoordinaten) "cover" in Zielrechteck zeichnen, mit Ken-Burns-Zoom/Pan
function drawCover(ctx, im, r, w, h, zoom = 1, px = .5, py = .5) {
  const sx0 = r[0] * im.width, sy0 = r[1] * im.height, sw = (r[2] - r[0]) * im.width, sh = (r[3] - r[1]) * im.height;
  const s = Math.max(w / sw, h / sh) * zoom;
  const vw = w / s, vh = h / s;
  const sx = sx0 + (sw - vw) * px, sy = sy0 + (sh - vh) * py;
  ctx.drawImage(im, sx, sy, vw, vh, 0, 0, w, h);
  return { sx, sy, s };
}

// Seite so zeichnen, wie die Kamera sie sieht (+ Zusatzzoom um Bildschirmpunkt)
function drawPageView(ctx, im, cam, folio, zx = 1, cx = W / 2, cy = H / 2) {
  const [sx, sy] = proj(cam, side(folio), 0);
  ctx.save(); ctx.translate(cx, cy); ctx.scale(zx, zx); ctx.translate(-cx, -cy);
  ctx.drawImage(im, sx, sy, PW * cam.z, PH * cam.z); ctx.restore();
}

// ===================================================================
//  DREHBUCH
// ===================================================================
const story = FMT === 'story';
const TOP = story ? 250 : 70;            // obere Textzone (Reels-UI oben frei lassen)
const CARD_W = W, CARD_Y = story ? 700 : 330;

// --- S0 Intro: Inhaltsverzeichnis S. 1 ---
key(0.0, focus(1, .3, .19, .62, .34, 1.0, .9, { rx: 4, rz: -2, off: .1 }));
key(1.7, focus(1, .06, .17, .94, .36, 1.0, .9, { rx: 2, rz: -1, off: .14 }), E.out);
key(2.7, pageView(1, { rx: 0, rz: 0 }));
scrim(0, 2.6, 'top', .38, .85, true);
caption({ panel: false, x: 64, t0: .15, t1: 2.6, y: TOP - 20, kicker: 'Terra Grischuna · Heft 5 | 2026', kickerColor: '#ff6a55',
  title: 'Heimweh – Fernweh', titleCls: 'kicker', titleSize: story ? 120 : 104, titleWeight: 800, lh: .95 });

// --- S1 Blättern zu S. 4/5 ---
let t = flip(2.75, 0, 2, .95, .32);                        // -> 4/5
key(2.95, flipView({ x: PW * .2 }));
key(t + .05, focus(4, 0, .03, 1, .36, 1, .9));
// --- S2 Kaffeebarone: Gemälde löst sich, Wasser bewegt sich ---
const kaffeeR = [0, .0419, 1, .3452];
const s2 = t + .25;
card({ src: hiSrc(4), folio: 4, r: kaffeeR, t0: s2, t1: s2 + 4.4,
  to: { x: 0, y: CARD_Y, w: CARD_W, h: story ? 760 : 560 },
  draw(ctx, w, h, lt, im) {
    // Ken Burns: langsamer Schwenk über die Fazenda
    const zoom = 1.05 + .08 * lt, px = .15 + .55 * E.ioS(clamp(lt));
    const cv = ctx.canvas;
    drawCover(ctx, im, kaffeeR, w, h, zoom, px, .5);
    // Wasser: zeilenweise Verschiebung im unteren Bilddrittel (Teich im Vordergrund)
    const y0 = Math.round(h * .62);
    const tmp = ctx.getImageData(0, y0, w, h - y0);
    const off = new OffscreenCanvas(w, h - y0); off.getContext('2d').putImageData(tmp, 0, 0);
    const T = lt * 4.4;
    for (let y = 0; y < h - y0; y += 2) {
      const depth = y / (h - y0);
      const dx = Math.sin(y * .11 + T * 2.6) * (1.2 + 3.5 * depth) + Math.sin(y * .037 - T * 1.3) * 2 * depth;
      ctx.drawImage(off, 0, y, w, 2, dx, y0 + y, w, 2);
    }
    // weiches Licht
    const g = ctx.createLinearGradient(0, 0, w, 0);
    const lx = -.3 + 1.6 * lt;
    g.addColorStop(clamp(lx - .2), 'rgba(255,240,210,0)'); g.addColorStop(clamp(lx), 'rgba(255,240,210,.10)'); g.addColorStop(clamp(lx + .2), 'rgba(255,240,210,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  } });
dim(s2, s2 + 4.4, .55);
caption({ t0: s2 + .7, t1: s2 + 4.3, y: TOP - 20, kicker: 'Die Auswanderer',
  title: '1855 zahlten Prättigauer Gemeinden armen Familien die Reise nach Brasilien.', titleSize: story ? 56 : 46, sub: 'Was sie auf den Kaffeeplantagen erwartete.', subSize: story ? 36 : 30 });
key(s2 + 4.4, focus(4, 0, .03, 1, .36, 1, .9));

// --- S3 Blättern zu S. 8/9 ---
t = flip(s2 + 4.55, 2, 2, .95, .32);
key(s2 + 4.75, flipView({ x: PW * .1 }));
const mapView = focus(8, .06, .29, .96, .87, 1.0, .62);
key(t + .1, mapView);
// --- S4 Statistik: Karte pulsiert, Zähler, Balken wachsen ---
const s4 = t + .1;
const dots = geo.mapDots.map((d, i) => {
  const g = el('div', 'glow', null, anchor), r1 = el('div', 'ring', null, anchor), r2 = el('div', 'ring', null, anchor);
  return { d, g, r1, r2, i, x: side(8) + d[0] * PW, y: d[1] * PH };
});
scrim(s4, s4 + 2.9, 'top', .40, .9);
const counter = caption({ t0: s4 + .2, t1: s4 + 2.9, y: TOP - 30, kicker: 'Statistik: Wer geht', title: 'über 16 500', titleCls: 'kicker', titleSize: story ? 130 : 110, titleWeight: 800,
  sub: 'Jugendliche verliessen Graubünden vom 15. Jahrhundert bis 1914, um als Zuckerbäcker zu arbeiten.', subSize: story ? 38 : 32 });
// Zahl: Wörter 4 und 5 ('16' '500') werden zählend ersetzt (Kicker = 3 Wörter, 'über' = Wort 3)
const p9 = geo.p9chart, p27 = geo.p27chart;
// Diagramm 1874–1920 (S. 9) – saubere Fläche + Balken, die von unten wachsen
function chartLayer(folio, gd, origSrc, cleanSrc) {
  const [x0, y0, x1, y1] = gd.rect;
  const box = el('div', null, null, anchor);
  Object.assign(box.style, { position: 'absolute', left: (side(folio) + x0 * PW) + 'px', top: (y0 * PH) + 'px', width: ((x1 - x0) * PW) + 'px', height: ((y1 - y0) * PH) + 'px', display: 'none' });
  const clean = el('div', null, null, box); Object.assign(clean.style, { position: 'absolute', inset: 0, background: `url(${cleanSrc}) 0 0/100% 100%` });
