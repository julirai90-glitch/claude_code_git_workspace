<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entwicklung der Unfallzahlen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --surface:#ffffff; --rule:#dde4e9; --rule-soft:#eef2f5;
  --ink:#14202a; --ink-2:#4a5b68; --ink-3:#71838f;
  --down:#0068a4; --up:#ee7733;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--surface)}
body{font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink); font-size:16px; line-height:1.5}
.wrap{padding:12px 16px 16px}
.chart{width:100%}
svg{display:block; max-width:100%; height:auto}
.tick{font-size:11.5px; fill:var(--ink-3)}
.ptitle{font-size:13.5px; fill:var(--ink); font-weight:600}
.pval{font-size:12.5px; font-variant-numeric:tabular-nums; font-weight:700}
.grid{stroke:var(--rule-soft); stroke-width:1}
.axis{stroke:var(--rule); stroke-width:1}
.src{font-size:12px; color:var(--ink-3); border-top:1px solid var(--rule-soft);
     padding-top:10px; margin:14px 0 0}
.tip{position:fixed; pointer-events:none; z-index:9; opacity:0;
  transform:translate(-50%,-100%); background:#fff; color:var(--ink);
  border:1px solid var(--rule); border-radius:3px; box-shadow:0 4px 14px rgba(20,32,42,.15);
  padding:8px 11px; font-size:13px; line-height:1.4; white-space:nowrap; transition:opacity .09s}
.tip b{font-variant-numeric:tabular-nums}
.tip .t-h{font-weight:700; display:block; margin-bottom:2px}
.hit{cursor:crosshair}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="chart"><svg id="c" role="img" aria-label="Vier Liniendiagramme: Entwicklung der Unfallzahlen 2011 bis 2025"></svg></div>
  <p class="src">Quelle: Bundesamt f&uuml;r Strassen ASTRA, Strassenverkehrsunfallorte. Grafik: S&uuml;dostschweiz</p>
</div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>
<script>
const D = {"years": [2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025], "panels": [{"t": "Alle Unfälle", "sub": "mit Personenschaden", "dir": "down", "y": [526, 500, 498, 526, 483, 492, 509, 445, 491, 406, 462, 453, 478, 460, 457], "slope": -4.89, "p": 0.0059, "fit": [513.3, 508.4, 503.5, 498.6, 493.7, 488.8, 484.0, 479.1, 474.2, 469.3, 464.4, 459.5, 454.6, 449.8, 444.9]}, {"t": "Unfälle mit Getöteten", "sub": "", "dir": "down", "y": [17, 17, 12, 15, 15, 14, 19, 13, 12, 11, 13, 12, 16, 8, 5], "slope": -0.53, "p": 0.0072, "fit": [17.0, 16.5, 15.9, 15.4, 14.9, 14.3, 13.8, 13.3, 12.7, 12.2, 11.7, 11.1, 10.6, 10.1, 9.5]}, {"t": "Unfälle mit Schwerverletzten", "sub": "", "dir": "up", "y": [73, 67, 68, 70, 80, 78, 73, 84, 88, 60, 77, 86, 74, 90, 86], "slope": 1.05, "p": 0.0399, "fit": [69.6, 70.7, 71.7, 72.7, 73.8, 74.8, 75.9, 76.9, 78.0, 79.0, 80.1, 81.1, 82.2, 83.2, 84.3]}, {"t": "Unfälle mit Velobeteiligung", "sub": "", "dir": "up", "y": [72, 58, 65, 76, 64, 64, 69, 73, 86, 102, 100, 86, 85, 82, 105], "slope": 2.56, "p": 0.0007, "fit": [61.2, 63.8, 66.3, 68.9, 71.5, 74.0, 76.6, 79.1, 81.7, 84.2, 86.8, 89.4, 91.9, 94.5, 97.0]}]};

const tip=document.getElementById('tip');
function showTip(e,html){
  tip.innerHTML=html; tip.style.opacity='1';
  const half=tip.offsetWidth/2, vw=window.innerWidth;
  tip.style.left=Math.max(half+6,Math.min(vw-half-6,e.clientX))+'px';
  tip.style.top=Math.max(tip.offsetHeight+8,e.clientY-12)+'px';
}
function hideTip(){tip.style.opacity='0';}
document.addEventListener('pointerdown',function(ev){
  const t=ev.target;
  if(!(t instanceof Element)||!t.classList.contains('hit')) hideTip();
},true);

const NS='http://www.w3.org/2000/svg';
function el(n,a){const x=document.createElementNS(NS,n);for(const k in(a||{}))x.setAttribute(k,a[k]);return x;}

function draw(){
  const W=document.querySelector('.chart').clientWidth||660;
  const COLS = W<520 ? 1 : 2;
  const PW=W/COLS, PH= W<520 ? 150 : 168;
  const rows=Math.ceil(D.panels.length/COLS);
  const H=rows*PH;
  const svg=document.getElementById('c');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.setAttribute('width',W); svg.setAttribute('height',H);
  svg.textContent='';

  D.panels.forEach(function(p,pi){
    const ox=(pi%COLS)*PW, oy=Math.floor(pi/COLS)*PH;
    const L=ox+44, R=16, T=oy+34, B=26;
    const iw=PW-44-R, ih=PH-34-B;
    const col = p.dir==='up' ? 'var(--up)' : 'var(--down)';
    /* each panel keeps its own scale — the four series differ by a factor of 30,
       a shared axis would flatten the fatalities into the baseline */
    const max = Math.ceil(Math.max.apply(null,p.y)*1.15/10)*10;
    const xAt=i=>L+iw*i/(D.years.length-1);
    const yAt=v=>T+ih-ih*v/max;

    const ti=el('text',{x:ox+4,y:oy+15,class:'ptitle'});
    ti.textContent=p.t; svg.appendChild(ti);

    svg.appendChild(el('line',{x1:L,y1:T+ih,x2:L+iw,y2:T+ih,class:'axis'}));
    [0,max/2,max].forEach(function(v){
      if(v>0) svg.appendChild(el('line',{x1:L,y1:yAt(v),x2:L+iw,y2:yAt(v),class:'grid'}));
      const t=el('text',{x:L-7,y:yAt(v)+4,class:'tick','text-anchor':'end'});
      t.textContent=Math.round(v); svg.appendChild(t);
    });

    /* the yearly values, thin */
    let d='M'+xAt(0)+','+yAt(p.y[0]);
    for(let i=1;i<p.y.length;i++) d+='L'+xAt(i)+','+yAt(p.y[i]);
    svg.appendChild(el('path',{d:d,fill:'none',stroke:col,'stroke-width':1.3,opacity:.42,
      'stroke-linejoin':'round'}));

    /* the fitted trend, thick — this is the statement */
    svg.appendChild(el('line',{x1:xAt(0),y1:yAt(p.fit[0]),
      x2:xAt(p.fit.length-1),y2:yAt(p.fit[p.fit.length-1]),
      stroke:col,'stroke-width':2.6,'stroke-linecap':'round'}));

    /* endpoints labelled: start and finish carry the story */
    [[0,p.y[0],'start'],[p.y.length-1,p.y[p.y.length-1],'end']].forEach(function(e){
      const i=e[0],v=e[1];
      svg.appendChild(el('circle',{cx:xAt(i),cy:yAt(v),r:3.6,fill:col,
        stroke:'var(--surface)','stroke-width':1.6}));
      const t=el('text',{x:e[2]==='start'?xAt(i)+7:xAt(i)-7,y:yAt(v)-9,
        class:'pval','text-anchor':e[2]==='start'?'start':'end'});
      t.setAttribute('fill',col); t.textContent=v; svg.appendChild(t);
    });

    [0,D.years.length-1].forEach(function(i){
      const t=el('text',{x:xAt(i),y:T+ih+16,class:'tick',
        'text-anchor':i===0?'start':'end'});
      t.textContent=D.years[i]; svg.appendChild(t);
    });

    for(let i=0;i<p.y.length;i++){
      const hit=el('rect',{x:xAt(i)-iw/(2*(p.y.length-1)),y:T,
        width:iw/(p.y.length-1),height:ih,fill:'transparent',class:'hit'});
      hit.addEventListener('pointerdown',__t); hit.addEventListener('mousemove',__t);
      function __t(e){
        showTip(e,'<span class="t-h">'+D.years[i]+'</span>'+p.t+': <b>'+p.y[i]+'</b>');
      }
      hit.addEventListener('mouseleave',hideTip);
      svg.appendChild(hit);
    }
  });
}
draw();
let rt; addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(draw,140);});
</script>
</body>
</html>
