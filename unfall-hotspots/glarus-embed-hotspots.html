<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Die Orte, an denen es immer wieder kracht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --surface:#ffffff; --rule:#dde4e9; --rule-soft:#eef2f5;
  --ink:#14202a; --ink-2:#4a5b68; --ink-3:#71838f;
  --s1:#0068a4;
  /* sequential ramp, one hue, light to dark — magnitude */
  --q0:#f1f4f6; --q1:#dceaf3; --q2:#b7d5e8; --q3:#8dbdd7; --q4:#5c9ec6;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--surface)}
body{font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink); font-size:16px; line-height:1.55}
.wrap{padding:12px 16px 16px}
.legend{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px;
  font-size:13px; color:var(--ink-2)}
.ramp{display:inline-flex; align-items:center; gap:3px}
.ramp .sw{width:18px; height:12px; border-radius:2px; flex:none}
.matrix{width:100%}
.mrow{display:grid; grid-template-columns:var(--labw) 1fr 34px; align-items:center;
  gap:8px; margin-bottom:2px}
.mlab{font-size:13px; color:var(--ink-2); line-height:1.25; text-align:right;
  overflow-wrap:break-word}
@media (max-width:560px){.mlab{font-size:12px}}
.mlab b{font-weight:600; color:var(--ink)}
.mcells{display:grid; grid-template-columns:repeat(15,1fr); gap:2px}
.cell{height:var(--cellh); border-radius:2px; display:flex; align-items:center;
  justify-content:center; font-size:11px; font-variant-numeric:tabular-nums;
  cursor:crosshair; color:var(--ink)}
.mtot{font-size:13px; font-weight:700; font-variant-numeric:tabular-nums;
  text-align:right; color:var(--ink)}
.mhead .mlab,.mhead .mtot{font-size:12px; color:var(--ink-3); font-weight:400}
.mhead .cell{height:auto; font-size:11px; color:var(--ink-3); cursor:default}
.src{font-size:12px; color:var(--ink-3); border-top:1px solid var(--rule-soft);
     padding-top:10px; margin:14px 0 0}
.tip{position:fixed; pointer-events:none; z-index:9; opacity:0;
  transform:translate(-50%,-100%); background:#fff; color:var(--ink);
  border:1px solid var(--rule); border-radius:3px; box-shadow:0 4px 14px rgba(20,32,42,.15);
  padding:8px 11px; font-size:13px; line-height:1.4; transition:opacity .09s; max-width:250px}
.tip .t-m{font-weight:700; display:block; margin-bottom:4px}
.tip b{font-variant-numeric:tabular-nums}
table.data{border-collapse:collapse; font-size:13px; width:100%; margin-top:10px}
table.data th,table.data td{border-bottom:1px solid var(--rule-soft); padding:4px 5px;
  text-align:right; font-variant-numeric:tabular-nums; vertical-align:top}
table.data th:first-child,table.data td:first-child{text-align:left; font-variant-numeric:normal}
table.data th{color:var(--ink-3); font-weight:600}
table.data a{color:var(--s1)}
details{margin-top:12px; font-size:13px; color:var(--ink-2)}
summary{cursor:pointer; color:var(--s1)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-palette="#0068a4,#ee7733">
<div class="wrap">
  <div class="legend">
    <span>Unf&auml;lle pro Jahr:</span>
    <span class="ramp">
      <span class="sw" style="background:var(--q0)"></span>
      <span class="sw" style="background:var(--q1)"></span>
      <span class="sw" style="background:var(--q2)"></span>
      <span class="sw" style="background:var(--q3)"></span>
      <span class="sw" style="background:var(--q4)"></span>
    </span>
    <span id="rampLab">0 &rarr; 5</span>
  </div>
  <div class="matrix" id="mx" role="img" aria-label="Raster: die zehn Orte im Kanton Glarus mit den meisten Unf&auml;llen, aufgeschl&uuml;sselt nach Jahr"></div>
  <p class="src">Unf&auml;lle mit Personenschaden im Umkreis von 100&nbsp;m, Kanton Glarus 2011&ndash;2025.
     Quelle: Bundesamt f&uuml;r Strassen ASTRA, Strassenverkehrsunfallorte; Ortsnamen: swisstopo.
     Grafik: S&uuml;dostschweiz</p>
  <details>
    <summary>Zahlen als Tabelle, mit Kartenlink zu jedem Ort</summary>
    <table class="data" id="tbl"></table>
  </details>
</div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>
<script>
/* DATA-START */
const YEARS = [2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025];
const ROWS = [{"label":"Glarus, Allmeindstrasse/Kirchweg","place":"Glarus","streets":["Allmeindstrasse","Kirchweg"],"e":2723996,"n":1211109,"years":[1,0,3,0,4,3,3,0,4,4,0,1,2,1,3],"total":29,"nyears":11,"fuss":16,"velo":5,"moto":1,"severe":8,"top":["Fussgängerunfall",12]},{"label":"Glarus, Kirchstrasse/Gerichtshausstrasse","place":"Glarus","streets":["Kirchstrasse","Gerichtshausstrasse"],"e":2723812,"n":1211293,"years":[3,2,0,5,2,2,1,1,2,0,2,1,2,1,1],"total":25,"nyears":13,"fuss":4,"velo":7,"moto":3,"severe":1,"top":["Überqueren der Fahrbahn",10]},{"label":"Netstal, Lerchenstrasse/Bruggli","place":"Netstal","streets":["Lerchenstrasse","Bruggli"],"e":2722636,"n":1213168,"years":[0,0,3,1,2,2,2,2,1,1,2,2,2,0,1],"total":21,"nyears":12,"fuss":3,"velo":1,"moto":8,"severe":2,"top":["Auffahrunfall",8]},{"label":"Netstal, Molliserstrasse/Hinterbühl","place":"Netstal","streets":["Molliserstrasse","Hinterbühl"],"e":2722980,"n":1214101,"years":[2,2,1,0,2,2,0,0,0,2,1,3,2,4,0],"total":21,"nyears":10,"fuss":4,"velo":5,"moto":3,"severe":4,"top":["Auffahrunfall",6]},{"label":"Bilten, Schäniserstrasse/Nationalstrasse","place":"Bilten","streets":["Schäniserstrasse","Nationalstrasse"],"e":2720873,"n":1223738,"years":[0,3,1,0,3,2,2,0,1,2,1,1,1,2,1],"total":20,"nyears":12,"fuss":0,"velo":1,"moto":3,"severe":1,"top":["Auffahrunfall",7]},{"label":"Näfels, Altweg/Oberdorf","place":"Näfels","streets":["Altweg","Oberdorf"],"e":2723101,"n":1217099,"years":[1,0,0,0,1,2,1,3,1,3,2,2,1,1,1],"total":19,"nyears":12,"fuss":2,"velo":6,"moto":1,"severe":0,"top":["Auffahrunfall",8]},{"label":"Näfels, Molliserstrasse/Obererlen","place":"Näfels","streets":["Molliserstrasse","Obererlen"],"e":2723770,"n":1217562,"years":[1,0,1,0,1,3,1,2,3,1,0,0,1,1,1],"total":16,"nyears":11,"fuss":1,"velo":8,"moto":2,"severe":5,"top":["Abbiegeunfall",4]},{"label":"Netstal, Molliserstrasse/Landstrasse","place":"Netstal","streets":["Molliserstrasse","Landstrasse"],"e":2722739,"n":1213657,"years":[2,2,0,0,1,0,3,1,1,1,0,1,0,0,3],"total":15,"nyears":9,"fuss":4,"velo":2,"moto":2,"severe":1,"top":["Fussgängerunfall",5]},{"label":"Glarus, Burgstrasse/Untere Pressistrasse","place":"Glarus","streets":["Burgstrasse","Untere Pressistrasse"],"e":2723822,"n":1211397,"years":[1,0,1,1,1,1,2,1,0,1,1,1,1,0,1],"total":13,"nyears":12,"fuss":1,"velo":5,"moto":2,"severe":2,"top":["Überqueren der Fahrbahn",10]},{"label":"Glarus, Kirchweg/Landstrasse","place":"Glarus","streets":["Kirchweg","Landstrasse"],"e":2724227,"n":1210682,"years":[0,1,2,2,0,4,1,1,0,0,0,0,0,1,1],"total":13,"nyears":8,"fuss":2,"velo":3,"moto":1,"severe":5,"top":["Schleuder- oder Selbstunfall",6]}];
/* DATA-END */

const MAX = Math.max.apply(null, ROWS.map(r => Math.max.apply(null, r.years)));
document.getElementById('rampLab').textContent = '0 → ' + MAX;

const tip = document.getElementById('tip');
function showTip(e, html){
  tip.innerHTML = html;
  tip.style.opacity = '1';
  /* keep the tooltip inside the viewport: it is centred on the pointer */
  const half = tip.offsetWidth / 2, vw = window.innerWidth;
  tip.style.left = Math.max(half + 6, Math.min(vw - half - 6, e.clientX)) + 'px';
  tip.style.top  = Math.max(tip.offsetHeight + 8, e.clientY - 12) + 'px';
}
function hideTip(){ tip.style.opacity = '0'; }
/* tapping anywhere but a cell closes the tooltip — phones have no mouseleave */
document.addEventListener('pointerdown', function(e){
  if (!e.target.classList || !e.target.classList.contains('cell')) hideTip();
}, true);

function colorOf(v){
  if(v === 0) return 'var(--q0)';
  if(v === 1) return 'var(--q1)';
  if(v === 2) return 'var(--q2)';
  if(v === 3) return 'var(--q3)';
  return 'var(--q4)';
}

function draw(){
  const W = document.body.clientWidth;
  const narrow = W < 560;
  const mx = document.getElementById('mx');
  mx.style.setProperty('--labw', narrow ? '104px' : '230px');
  mx.style.setProperty('--cellh', narrow ? '20px' : '24px');
  mx.textContent = '';

  /* header row: a year label every second column, else the axis is unreadable */
  const head = document.createElement('div');
  head.className = 'mrow mhead';
  let cells = '';
  YEARS.forEach(function(y, i){
    const show = narrow ? (i === 0 || i === YEARS.length - 1) : (i % 2 === 0);
    cells += '<span class="cell">' + (show ? "'" + String(y).slice(2) : '') + '</span>';
  });
  head.innerHTML = '<div class="mlab">Ort</div><div class="mcells">' + cells +
                   '</div><div class="mtot">Total</div>';
  mx.appendChild(head);

  ROWS.forEach(function(r){
    const row = document.createElement('div');
    row.className = 'mrow';
    /* the place name carries the identity — never the colour alone */
    const streets = narrow ? r.streets.slice(0,1) : r.streets;
    const lab = '<b>' + r.place + '</b>, ' + streets.join('/');
    let html = '<div class="mlab">' + lab + '</div><div class="mcells">';
    r.years.forEach(function(v, i){
      html += '<span class="cell" data-i="' + i + '" style="background:' + colorOf(v) +
              '">' + (v > 0 && !narrow ? v : '') + '</span>';
    });
    html += '</div><div class="mtot">' + r.total + '</div>';
    row.innerHTML = html;
    row.querySelectorAll('.cell').forEach(function(c){
      const i = +c.dataset.i, v = r.years[i];
      function onHit(e){
        showTip(e, '<span class="t-m">' + r.label + '</span>' +
          YEARS[i] + ': <b>' + v + '</b> Unfall' + (v === 1 ? '' : 'e') +
          '<br><span style="color:var(--ink-3)">' + r.total + ' Unfälle in ' + r.nyears +
          ' von ' + YEARS.length + ' Jahren · ' + r.severe + ' davon schwer oder tödlich</span>');
      }
      c.addEventListener('pointerdown', onHit);
      c.addEventListener('mousemove', onHit);
      c.addEventListener('mouseleave', hideTip);
    });
    mx.appendChild(row);
  });
}
draw();
let t; addEventListener('resize', function(){ clearTimeout(t); t = setTimeout(draw, 140); });

/* table view — the relief the contrast check asks for, and the audit trail:
   every row links to its coordinates on map.geo.admin.ch */
(function(){
  let h = '<tr><th>Ort</th><th>Unf&auml;lle</th><th>Jahre mit<br>Unfall</th>' +
          '<th>schwer/<br>t&ouml;dlich</th><th>h&auml;ufigster Typ</th><th>Karte</th></tr>';
  ROWS.forEach(function(r){
    h += '<tr><td>' + r.label + '</td><td>' + r.total + '</td><td>' + r.nyears + ' / ' +
         YEARS.length + '</td><td>' + r.severe + '</td><td style="text-align:left">' +
         r.top[0] + ' (' + r.top[1] + ')</td><td><a target="_blank" rel="noopener" href="' +
         'https://map.geo.admin.ch/#/map?center=' + r.e + ',' + r.n + '&z=11">öffnen</a></td></tr>';
  });
  document.getElementById('tbl').innerHTML = h;
})();

/* ---- report our height to the embedding page -------------------------
   The host sets the iframe height from this; see the embed code in
   _research/artikel-geruest.md. Harmless when nobody listens. */
(function(){
  let last = 0;
  function report(){
    const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (h === last) return;                    // don't spam identical values
    last = h;
    try { parent.postMessage({ type: 'sos-embed-height', height: h }, '*'); }
    catch (e) { /* cross-origin parents may refuse; nothing we can do */ }
  }
  addEventListener('load', report);
  addEventListener('resize', report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.body);
  document.addEventListener('toggle', report, true);   // <details> open/close
  report();
})();
</script>
</body>
</html>
