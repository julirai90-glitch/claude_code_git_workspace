const FACTS = {"total":{"n":157,"moto":109,"severe":48,"dead":6},"Uri":{"n":110,"moto":73,"severe":33,"dead":4},"Glarus":{"n":47,"moto":36,"severe":15,"dead":2},"low":{"n":71,"moto":41,"severe":19,"dead":3},"high":{"n":86,"moto":68,"severe":29,"dead":3},"lowUri":{"n":41,"moto":15,"severe":7,"dead":1},"border_km":35500,"peak":[23801,1943],"len_km":46.0};
/* DATA-END */
function de(x){ return String(x).replace('.', ','); }
const MN = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

const tip = document.getElementById('tip');
function showTip(e, html){
  tip.innerHTML = html;
  tip.style.opacity = '1';
  /* keep the tooltip inside the viewport: it is centred on the pointer */
  const half = tip.offsetWidth / 2, vw = window.innerWidth;
  tip.style.left = Math.max(half + 6, Math.min(vw - half - 6, e.clientX)) + 'px';
  tip.style.top  = Math.max(tip.offsetHeight + 8, e.clientY - 12) + 'px';
}
function hideTip(){ tip.style.opacity = '0'; }
document.addEventListener('pointerdown', function(e){
  if (!e.target.classList || !e.target.classList.contains('hit')) hideTip();
}, true);

const NS = 'http://www.w3.org/2000/svg';
function el(n,a){ const x=document.createElementNS(NS,n); for(const k in (a||{})) x.setAttribute(k,a[k]); return x; }

const KM_MAX = PROFIL[PROFIL.length-1][0];
const H_MIN = 300, H_MAX = 2400;   /* headroom: the stacks at the pass run high */

function draw(){
  const W = document.querySelector('.chart').clientWidth || 640;
  const narrow = W < 500;
  const L = narrow ? 30 : 40, R = 8, T = narrow ? 42 : 34, B = 34;
  const H = narrow ? 330 : 380;
  const iw = W-L-R, ih = H-T-B;
  const x = km => L + iw * km / KM_MAX;
  const y = h  => T + ih - ih * (h - H_MIN) / (H_MAX - H_MIN);
  const svg = document.getElementById('c');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.setAttribute('width',W); svg.setAttribute('height',H);
  svg.textContent = '';

  for(let h = 500; h <= 2000; h += 500){
    svg.appendChild(el('line',{x1:L, y1:y(h), x2:W-R, y2:y(h), class:'grid'}));
    const t = el('text',{x:L-6, y:y(h)+4, class:'tick','text-anchor':'end'});
    t.textContent = h; svg.appendChild(t);
  }

  /* the mountain: the road's own elevation profile as a filled silhouette */
  let dpath = 'M' + x(PROFIL[0][0]) + ',' + y(PROFIL[0][1]);
  PROFIL.forEach(function(p){ dpath += ' L' + x(p[0]).toFixed(1) + ',' + y(p[1]).toFixed(1); });
  const base = dpath + ' L' + x(KM_MAX) + ',' + (T+ih) + ' L' + x(0) + ',' + (T+ih) + ' Z';
  svg.appendChild(el('path',{d:base, fill:'var(--berg)'}));
  svg.appendChild(el('path',{d:dpath, fill:'none', stroke:'var(--berg-line)', 'stroke-width':1.5,
    'stroke-linejoin':'round'}));

  /* cantonal border, so the two halves stay tellable apart */
  const bx = x(FACTS.border_km);
  svg.appendChild(el('line',{x1:bx, y1:T-2, x2:bx, y2:T+ih, class:'border'}));
  const bl = el('text',{x:bx-4, y:T-8, class:'place','text-anchor':'end'});
  bl.textContent = 'Uri'; svg.appendChild(bl);
  const br = el('text',{x:bx+4, y:T-8, class:'place','text-anchor':'start'});
  br.textContent = 'Glarus'; svg.appendChild(br);

  /* place names along the bottom; on a phone only the three that orient */
  const keep = narrow ? ['Altdorf','Klausenpass','Linthal']
                     : ['Altdorf','Unterschächen','Klausenpass','Urnerboden','Linthal'];
  ORTE.forEach(function(o){
    if(keep.indexOf(o.name) < 0) return;
    const px = x(o.km);
    svg.appendChild(el('line',{x1:px, y1:T+ih, x2:px, y2:T+ih+4, class:'pline'}));
    const anchor = o.km < KM_MAX*0.08 ? 'start' : (o.km > KM_MAX*0.92 ? 'end' : 'middle');
    const t = el('text',{x:px, y:H-20, class:'place' + (o.name==='Klausenpass' ? ' strong':''),
      'text-anchor':anchor});
    t.textContent = o.name; svg.appendChild(t);
  });
  const km = el('text',{x:W-R, y:H-6, class:'tick','text-anchor':'end'});
  km.textContent = de(FACTS.len_km) + ' km'; svg.appendChild(km);
  const m = el('text',{x:narrow ? L+2 : L-6, y:T-8, class:'tick',
    'text-anchor': narrow ? 'start' : 'end'});
  m.textContent = 'm ü. M.'; svg.appendChild(m);

  /* one dot per accident, sitting on the road and stacking upwards where
     several share a stretch — the stack height is the local density */
  const r = narrow ? 3 : 3.6, gap = 2 * r + 1.4;
  const placed = [];
  PUNKTE.slice().sort((a,b) => a.km - b.km).forEach(function(p){
    const px = x(p.km), py0 = y(p.h) - r - 1;
    /* push strictly upwards — assigning q.y - gap outright lets a dot bounce
       between two neighbours and never settle */
    let py = py0;
    for(let pass = 0; pass < 200; pass++){
      let moved = false;
      for(const q of placed){
        if(Math.abs(q.x - px) < gap && Math.abs(q.y - py) < gap){
          py = Math.min(py, q.y - gap); moved = true;
        }
      }
      if(!moved) break;
    }
    placed.push({x:px, y:py, p:p});
  });
  placed.forEach(function(q){
    svg.appendChild(el('circle',{cx:q.x.toFixed(1), cy:q.y.toFixed(1), r:r,
      fill: q.p.moto ? 'var(--s2)' : 'var(--s1)',
      stroke:'var(--surface)', 'stroke-width':1.4}));
    const hit = el('circle',{cx:q.x.toFixed(1), cy:q.y.toFixed(1), r:r+3,
      fill:'transparent', class:'hit'});
    const sev = {as1:'Unfall mit Getöteten', as2:'Unfall mit Schwerverletzten',
                 as3:'Unfall mit Leichtverletzten'}[q.p.sev];
    function onHit(e){
      showTip(e, '<span class="t-m">' + MN[q.p.m-1] + ' ' + q.p.y + '</span>' +
        (q.p.moto ? 'mit Motorrad' : 'ohne Motorrad') + ' · ' + sev + '<br>' +
        '<span style="color:var(--ink-3)">km ' + de((q.p.km/1000).toFixed(1)) + ' ab Altdorf · ' +
        q.p.h + ' m ü. M. · Kanton ' + q.p.side + '</span>');
    }
    hit.addEventListener('pointerdown', onHit);
    hit.addEventListener('mousemove', onHit);
    hit.addEventListener('mouseleave', hideTip);
    svg.appendChild(hit);
  });
}
draw();
let t; addEventListener('resize', function(){ clearTimeout(t); t = setTimeout(draw, 140); });

/* ---- report our height to the embedding page -------------------------
   The host sets the iframe height from this; see the embed code in
   _research/artikel-geruest.md. Harmless when nobody listens. */
(function(){
  let last = 0;
  function report(){
    const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (h === last) return;                    // don't spam identical values
    last = h;
    try { parent.postMessage({ type: 'sos-embed-height', height: h }, '*'); }
    catch (e) { /* cross-origin parents may refuse; nothing we can do */ }
  }
  addEventListener('load', report);
  addEventListener('resize', report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.body);
  document.addEventListener('toggle', report, true);   // <details> open/close
  report();
})();
</script>
