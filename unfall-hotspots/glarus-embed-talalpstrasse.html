<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filzbach–Habergschwänd: wo man allein verunfallt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --surface:#ffffff; --rule:#dde4e9; --rule-soft:#eef2f5;
  --ink:#14202a; --ink-2:#4a5b68; --ink-3:#71838f;
  --s1:#0068a4; --s2:#ee7733;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--surface)}
body{font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink); font-size:16px; line-height:1.55}
.wrap{padding:12px 16px 16px}
.pair{margin-bottom:22px}
.ptitle{font-size:15px; font-weight:600; margin-bottom:10px}
.prow{display:grid; grid-template-columns:var(--labw) 1fr; gap:10px; align-items:center;
  margin-bottom:7px}
.plab{font-size:13px; text-align:right; line-height:1.2; color:var(--ink-2)}
.plab b{color:var(--ink); font-weight:600}
.ptrack{position:relative; height:30px; background:var(--rule-soft); border-radius:3px}
.pfill{position:absolute; left:0; top:0; bottom:0; border-radius:3px; background:var(--s1)}
.pfill.accent{background:var(--s2)}
.pval{position:absolute; top:0; bottom:0; display:flex; align-items:center; gap:7px;
  font-size:14px; font-variant-numeric:tabular-nums; white-space:nowrap; padding-left:9px}
.pval b{font-size:17px}
/* inside the orange bar: ink reads at 5.8:1, white would be 2.9:1 */
.pval.inside{padding:0 11px 0 0; color:var(--ink)}
.pval.inside span{color:rgba(20,32,42,.7)}
.facts{margin:4px 0 0; padding-top:14px; border-top:1px solid var(--rule-soft);
  font-size:14px; color:var(--ink-2)}
.facts b{color:var(--ink); font-variant-numeric:tabular-nums}
.rank{margin-top:20px}
.rank h3{font-size:14px; margin:0 0 8px; font-weight:600}
.rrow{display:grid; grid-template-columns:var(--rlabw) 1fr 46px; gap:8px; align-items:center;
  margin-bottom:4px; font-size:13px}
.rlab{text-align:right; line-height:1.2; color:var(--ink-2)}
.rlab b{color:var(--ink)}
.rlab .rplace{font-size:11px; color:var(--ink-3)}
.rtrack{position:relative; height:13px; background:var(--rule-soft); border-radius:2px}
.rfill{position:absolute; left:0; top:0; bottom:0; border-radius:2px; background:var(--s1)}
.rfill.accent{background:var(--s2)}
.rval{font-variant-numeric:tabular-nums; color:var(--ink-2); text-align:right}
.src{font-size:12px; color:var(--ink-3); border-top:1px solid var(--rule-soft);
     padding-top:10px; margin:16px 0 0}
table.data{border-collapse:collapse; font-size:13px; width:100%; margin-top:10px}
table.data th,table.data td{border-bottom:1px solid var(--rule-soft); padding:3px 5px;
  text-align:right; font-variant-numeric:tabular-nums}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data th{color:var(--ink-3); font-weight:600}
details{margin-top:12px; font-size:13px; color:var(--ink-2)}
summary{cursor:pointer; color:var(--s1)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-palette="#ee7733,#0068a4">
<div class="wrap">
  <div id="pairs"></div>
  <p class="facts" id="facts"></p>
  <div class="rank" id="rank"></div>
  <p class="src" id="src"></p>
  <details>
    <summary>Zahlen als Tabelle</summary>
    <table class="data" id="tbl"></table>
  </details>
</div>
<script>
/* DATA-START */
const FACTS = {"n":17,"self":{"n":17,"k":15,"pct":88.2},"kanton_self":{"n":1366,"k":495,"pct":36.2},"severe":{"n":17,"k":8,"pct":47.1},"kanton_severe":{"n":1366,"k":319,"pct":23.4},"weekend":{"n":17,"k":8,"pct":47.1},"kanton_weekend":{"n":1366,"k":405,"pct":29.6},"months":[[1,1],[6,3],[7,6],[8,4],[9,1],[10,2]],"hours":[11,18],"types":[["Schleuder- oder Selbstunfall",15],["Fussgängerunfall",1],["Einbiegeunfall",1]],"parts":{"Motorrad":0,"Velo":3,"zu Fuss":1,"nur Motorfahrzeuge":13},"km":8.31,"label":"Talalpstrasse/Habergschwändstrasse"};
const RANK = [{"street":"Talalpstrasse/Habergschwändstrasse","place":"Filzbach","n":17,"self":15,"pct":88.2},{"street":"Klausenstrasse","place":"Linthal","n":47,"self":34,"pct":72.3},{"street":"Mühle","place":"Näfels","n":17,"self":9,"pct":52.9}];
const RANK_FULL = [{"street":"Talalpstrasse/Habergschwändstrasse","place":"Filzbach","n":17,"self":15,"pct":88.2},{"street":"Klausenstrasse","place":"Linthal","n":47,"self":34,"pct":72.3},{"street":"Mühle","place":"Näfels","n":17,"self":9,"pct":52.9},{"street":"Nationalstrasse","place":"Glarus Nord","n":14,"self":7,"pct":50.0},{"street":"Klöntalerstrasse","place":"Klöntal","n":12,"self":6,"pct":50.0},{"street":"Nationalstrasse","place":"Filzbach","n":14,"self":6,"pct":42.9},{"street":"Nationalstrasse","place":"Bilten","n":48,"self":18,"pct":37.5},{"street":"Ygrubenstrasse","place":"Glarus","n":14,"self":4,"pct":28.6},{"street":"Hauptstrasse","place":"Schwanden GL","n":15,"self":4,"pct":26.7},{"street":"Landstrasse","place":"Netstal","n":48,"self":12,"pct":25.0},{"street":"Kirchweg","place":"Glarus","n":24,"self":6,"pct":25.0},{"street":"Flechsenstrasse","place":"Mollis","n":13,"self":3,"pct":23.1},{"street":"Molliserstrasse","place":"Netstal","n":27,"self":6,"pct":22.2},{"street":"Hauptstrasse","place":"Mitlödi","n":20,"self":4,"pct":20.0},{"street":"Molliserstrasse","place":"Näfels","n":12,"self":2,"pct":16.7},{"street":"Altweg","place":"Näfels","n":14,"self":2,"pct":14.3},{"street":"Schäniserstrasse","place":"Bilten","n":22,"self":3,"pct":13.6},{"street":"Oberurnerstrasse","place":"Näfels","n":19,"self":2,"pct":10.5},{"street":"Landstrasse","place":"Glarus","n":54,"self":5,"pct":9.3},{"street":"Oberdorf","place":"Näfels","n":13,"self":1,"pct":7.7},{"street":"Kirchstrasse","place":"Glarus","n":13,"self":0,"pct":0.0},{"street":"Gerichtshausstrasse","place":"Glarus","n":12,"self":0,"pct":0.0},{"street":"Unterdorf","place":"Näfels","n":12,"self":0,"pct":0.0}];
const MIN_N = 12;
/* DATA-END */
const MN = ['Januar','Februar','März','April','Mai','Juni','Juli','August',
            'September','Oktober','November','Dezember'];
function de(x){ return String(x).replace('.', ','); }
const ROUTE = '<b>Talalpstrasse und<br>Habergschwändstrasse</b><br>Filzbach';

/* both bars share one 0–100 % scale, so the two rows are directly comparable */
function pair(title, a, b, labelA, labelB){
  return '<div class="pair"><div class="ptitle">' + title + '</div>' +
    row(labelA, a, true) + row(labelB, b, false) + '</div>';
}
function row(label, d, accent){
  return '<div class="prow"><div class="plab">' + label + '</div>' +
    '<div class="ptrack"><div class="pfill' + (accent ? ' accent' : '') +
    '" style="width:' + d.pct + '%"></div>' +
    (d.pct > 55
      ? '<div class="pval inside" style="right:0"><b>' + de(d.pct) + ' %</b>' +
        '<span>' + d.k + ' von ' + d.n + '</span></div>'
      : '<div class="pval" style="left:' + d.pct + '%"><b>' + de(d.pct) + ' %</b>' +
        '<span style="color:var(--ink-3)">' + d.k + ' von ' + d.n + '</span></div>') +
    '</div></div>';
}

document.getElementById('pairs').innerHTML =
  pair('Unfälle ohne zweite Partei — Schleuder- und Selbstunfälle',
       FACTS.self, FACTS.kanton_self, ROUTE, 'Kanton Glarus') +
  pair('Unfälle, die schwer oder tödlich enden',
       FACTS.severe, FACTS.kanton_severe, ROUTE, 'Kanton Glarus') +
  pair('Unfälle an einem Samstag oder Sonntag',
       FACTS.weekend, FACTS.kanton_weekend, ROUTE, 'Kanton Glarus');

/* the months are not a span: 15 sit in the summer half year, one in January */
(function(){
  const summer = FACTS.months.filter(m => m[0] >= 5 && m[0] <= 10);
  const n = summer.reduce((s, m) => s + m[1], 0);
  const rest = FACTS.months.filter(m => m[0] < 5 || m[0] > 10);
  const first = MN[summer[0][0]-1], last = MN[summer[summer.length-1][0]-1];
  const t = FACTS.types.map(x => '<b>' + x[1] + '</b>× ' + x[0]).join(', ');
  document.getElementById('facts').innerHTML =
    'Die <b>' + FACTS.n + '</b> Unfälle im Einzelnen: ' + t + '. Beteiligt waren <b>' +
    FACTS.parts['Velo'] + '</b>× ein Velo und <b>' + FACTS.parts['zu Fuss'] +
    '</b>× eine Person zu Fuss, nie ein Motorrad; bei den übrigen <b>' +
    FACTS.parts['nur Motorfahrzeuge'] + '</b> ist keine dieser Gruppen vermerkt. ' +
    '<b>' + n + '</b> der Unfälle fielen in die Monate ' + first + ' bis ' + last +
    (rest.length ? ', ' + (rest.length === 1 ? 'einer' : rest.length + ' weitere') +
      ' in den ' + MN[rest[0][0]-1] : '') +
    ' — und alle in die Zeit zwischen ' + FACTS.hours[0] + ' und ' + FACTS.hours[1] + ' Uhr.' +
    /* the two bars are not equally solid — say which one carries weight */
    ' <span style="color:var(--ink-3)">Belastbar ist davon der Anteil der Unfälle ohne zweite ' +
    'Partei (Fisher p = 0,000013). Dass hier auch überdurchschnittlich viele Unfälle schwer ' +
    'enden, ist bei 17 Fällen ein schwacher Befund (p = 0,037) und hält einer Korrektur für ' +
    'die Zahl der geprüften Hypothesen nicht stand.</span>';
})();

/* the ranking is what turns one road into a finding: it leads the canton */
(function(){
  const narrow = window.innerWidth < 520;
  document.getElementById('rank').style.setProperty('--rlabw', narrow ? '116px' : '190px');
  let h = '<h3>Anteil Unfälle ohne zweite Partei — Strassen mit mindestens ' + MIN_N +
          ' Unfällen — die drei höchsten</h3>';
  RANK.forEach(function(r){
    const lead = r.street === FACTS.label;
    /* the merged route name is too long for the phone label column */
    h += '<div class="rrow"><div class="rlab"><b>' + r.street.replace('/', '/<br>') + '</b>' +
         (narrow ? '<br><span class="rplace">' + r.place + '</span>' : ', ' + r.place) + '</div>' +
         '<div class="rtrack"><div class="rfill' + (lead ? ' accent' : '') +
         '" style="width:' + r.pct + '%"></div></div>' +
         '<div class="rval">' + Math.round(r.pct) + ' %</div></div>';
  });
  document.getElementById('rank').innerHTML = h;
})();

document.getElementById('src').innerHTML =
  'Unfälle mit Personenschaden, Kanton Glarus 2011–2025. Die beiden Strassen bilden die ' +
  de(FACTS.km) + ' km lange Strecke von Filzbach zur Talstation der Sportbahnen ' +
  'Kerenzerberg und weiter hinauf nach Habergschwänd. Gemessen an der Zahl der Unfälle ' +
  'pro Kilometer ist sie unauffällig; aussergewöhnlich ist, <i>wie</i> dort verunfallt wird. ' +
  '<b>Zur Einordnung:</b> Die Unfallstatistik des ASTRA kennt nur die Kategorien Velo, ' +
  'Motorrad und Fussgänger — Trottinette werden nicht separat ausgewiesen und erscheinen ' +
  'als Schleuder- oder Selbstunfall ohne Vermerk. Mehrere Unfälle auf dieser Strecke sind ' +
  'von der Kantonspolizei Glarus als Trottinett-Selbstunfälle gemeldet worden, darunter ' +
  'der einzige Unfall auf der Habergschwändstrasse (18. August 2022). Wie viele der ' +
  FACTS.parts['nur Motorfahrzeuge'] + ' Unfälle ohne Vermerk Trottinette betreffen, ' +
  'geht aus den Daten nicht hervor. ' +
  'Quellen: Bundesamt für Strassen ASTRA, Strassenverkehrsunfallorte; Strassennamen: ' +
  'swisstopo; Strassenlänge: OpenStreetMap; Polizeimeldungen: Kantonspolizei Glarus. ' +
  'Grafik: Südostschweiz';

(function(){
  let h = '<tr><th>Strasse</th><th>Ort</th><th>Unf&auml;lle</th>' +
          '<th>ohne zweite<br>Partei</th><th>Anteil</th></tr>';
  RANK_FULL.forEach(function(r){
    h += '<tr><td>' + r.street + '</td><td style="text-align:left">' + r.place + '</td><td>' +
         r.n + '</td><td>' + r.self + '</td><td>' + de(r.pct) + ' %</td></tr>';
  });
  h += '<tr><td colspan="2"><b>Kanton Glarus</b></td><td><b>' + FACTS.kanton_self.n +
       '</b></td><td><b>' + FACTS.kanton_self.k + '</b></td><td><b>' +
       de(FACTS.kanton_self.pct) + ' %</b></td></tr>';
  document.getElementById('tbl').innerHTML = h;
})();

/* ---- report our height to the embedding page -------------------------
   The host sets the iframe height from this; see the embed code in
   _research/artikel-geruest.md. Harmless when nobody listens. */
(function(){
  let last = 0;
  function report(){
    const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (h === last) return;                    // don't spam identical values
    last = h;
    try { parent.postMessage({ type: 'sos-embed-height', height: h }, '*'); }
    catch (e) { /* cross-origin parents may refuse; nothing we can do */ }
  }
  addEventListener('load', report);
  addEventListener('resize', report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.body);
  document.addEventListener('toggle', report, true);   // <details> open/close
  report();
})();
</script>
</body>
</html>
