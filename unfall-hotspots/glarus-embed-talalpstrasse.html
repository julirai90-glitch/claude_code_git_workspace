<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talalpstrasse: wo man allein verunfallt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --surface:#ffffff; --rule:#dde4e9; --rule-soft:#eef2f5;
  --ink:#14202a; --ink-2:#4a5b68; --ink-3:#71838f;
  --s1:#0068a4; --s2:#ee7733;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--surface)}
body{font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink); font-size:16px; line-height:1.55}
.wrap{padding:12px 16px 16px}
.pair{margin-bottom:22px}
.ptitle{font-size:15px; font-weight:600; margin-bottom:10px}
.prow{display:grid; grid-template-columns:var(--labw) 1fr; gap:10px; align-items:center;
  margin-bottom:7px}
.plab{font-size:13px; text-align:right; line-height:1.2; color:var(--ink-2)}
.plab b{color:var(--ink); font-weight:600}
.ptrack{position:relative; height:30px; background:var(--rule-soft); border-radius:3px}
.pfill{position:absolute; left:0; top:0; bottom:0; border-radius:3px; background:var(--s1)}
.pfill.accent{background:var(--s2)}
.pval{position:absolute; top:0; bottom:0; display:flex; align-items:center; gap:7px;
  font-size:14px; font-variant-numeric:tabular-nums; white-space:nowrap; padding-left:9px}
.pval b{font-size:17px}
/* inside the orange bar: ink reads at 5.8:1, white would be 2.9:1 */
.pval.inside{padding:0 11px 0 0; color:var(--ink)}
.pval.inside span{color:rgba(20,32,42,.7)}
.facts{margin:4px 0 0; padding-top:14px; border-top:1px solid var(--rule-soft);
  font-size:14px; color:var(--ink-2)}
.facts b{color:var(--ink); font-variant-numeric:tabular-nums}
.rank{margin-top:20px}
.rank h3{font-size:14px; margin:0 0 8px; font-weight:600}
.rrow{display:grid; grid-template-columns:var(--rlabw) 1fr 46px; gap:8px; align-items:center;
  margin-bottom:4px; font-size:13px}
.rlab{text-align:right; line-height:1.2; color:var(--ink-2)}
.rlab b{color:var(--ink)}
.rlab .rplace{font-size:11px; color:var(--ink-3)}
.rtrack{position:relative; height:13px; background:var(--rule-soft); border-radius:2px}
.rfill{position:absolute; left:0; top:0; bottom:0; border-radius:2px; background:var(--s1)}
.rfill.accent{background:var(--s2)}
.rval{font-variant-numeric:tabular-nums; color:var(--ink-2); text-align:right}
.src{font-size:12px; color:var(--ink-3); border-top:1px solid var(--rule-soft);
     padding-top:10px; margin:16px 0 0}
table.data{border-collapse:collapse; font-size:13px; width:100%; margin-top:10px}
table.data th,table.data td{border-bottom:1px solid var(--rule-soft); padding:3px 5px;
  text-align:right; font-variant-numeric:tabular-nums}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data th{color:var(--ink-3); font-weight:600}
details{margin-top:12px; font-size:13px; color:var(--ink-2)}
summary{cursor:pointer; color:var(--s1)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-palette="#ee7733,#0068a4">
<div class="wrap">
  <div id="pairs"></div>
  <p class="facts" id="facts"></p>
  <div class="rank" id="rank"></div>
  <p class="src" id="src"></p>
  <details>
    <summary>Zahlen als Tabelle</summary>
    <table class="data" id="tbl"></table>
  </details>
</div>
<script>
/* DATA-START */
const FACTS = {"n":16,"self":{"n":16,"k":14,"pct":87.5},"kanton_self":{"n":1366,"k":495,"pct":36.2},"severe":{"n":16,"k":8,"pct":50.0},"kanton_severe":{"n":1366,"k":319,"pct":23.4},"months":[[1,1],[6,3],[7,6],[8,3],[9,1],[10,2]],"hours":[11,18],"weekend":8,"velo":3,"moto":0,"km":6.65};
const RANK = [{"street":"Talalpstrasse","place":"Filzbach","n":16,"self":14,"pct":87.5},{"street":"Klausenstrasse","place":"Linthal","n":47,"self":34,"pct":72.3},{"street":"Mühle","place":"Näfels","n":17,"self":9,"pct":52.9},{"street":"Nationalstrasse","place":"Glarus Nord","n":14,"self":7,"pct":50.0},{"street":"Klöntalerstrasse","place":"Klöntal","n":12,"self":6,"pct":50.0},{"street":"Nationalstrasse","place":"Filzbach","n":14,"self":6,"pct":42.9},{"street":"Nationalstrasse","place":"Bilten","n":48,"self":18,"pct":37.5},{"street":"Ygrubenstrasse","place":"Glarus","n":14,"self":4,"pct":28.6}];
const MIN_N = 12;
/* DATA-END */
const MN = ['Januar','Februar','März','April','Mai','Juni','Juli','August',
            'September','Oktober','November','Dezember'];
function de(x){ return String(x).replace('.', ','); }

/* both bars share one 0–100 % scale, so the two rows are directly comparable */
function pair(title, a, b, labelA, labelB){
  return '<div class="pair"><div class="ptitle">' + title + '</div>' +
    row(labelA, a, true) + row(labelB, b, false) + '</div>';
}
function row(label, d, accent){
  return '<div class="prow"><div class="plab">' + label + '</div>' +
    '<div class="ptrack"><div class="pfill' + (accent ? ' accent' : '') +
    '" style="width:' + d.pct + '%"></div>' +
    (d.pct > 55
      ? '<div class="pval inside" style="right:0"><b>' + de(d.pct) + ' %</b>' +
        '<span>' + d.k + ' von ' + d.n + '</span></div>'
      : '<div class="pval" style="left:' + d.pct + '%"><b>' + de(d.pct) + ' %</b>' +
        '<span style="color:var(--ink-3)">' + d.k + ' von ' + d.n + '</span></div>') +
    '</div></div>';
}

document.getElementById('pairs').innerHTML =
  pair('Unfälle ohne zweite Partei — Schleuder- und Selbstunfälle',
       FACTS.self, FACTS.kanton_self, '<b>Talalpstrasse</b><br>Filzbach', 'Kanton Glarus') +
  pair('Unfälle, die schwer oder tödlich enden',
       FACTS.severe, FACTS.kanton_severe, '<b>Talalpstrasse</b><br>Filzbach', 'Kanton Glarus');

/* the months are not a span: 15 sit in the summer half year, one in January */
(function(){
  const summer = FACTS.months.filter(m => m[0] >= 5 && m[0] <= 10);
  const n = summer.reduce((s, m) => s + m[1], 0);
  const rest = FACTS.months.filter(m => m[0] < 5 || m[0] > 10);
  const first = MN[summer[0][0]-1], last = MN[summer[summer.length-1][0]-1];
  document.getElementById('facts').innerHTML =
    '<b>' + n + '</b> der <b>' + FACTS.n + '</b> Unfälle fielen in die Monate ' + first +
    ' bis ' + last + (rest.length ? ', ' + (rest.length === 1 ? 'einer' : rest.length + ' weitere') +
      ' in den ' + MN[rest[0][0]-1] : '') +
    ' — und alle in die Zeit zwischen ' + FACTS.hours[0] + ' und ' + FACTS.hours[1] +
    ' Uhr. <b>' + FACTS.weekend + '</b> davon passierten an einem Samstag oder Sonntag. ' +
    'Kein einziger Unfall mit einem Motorrad, <b>' + FACTS.velo + '</b> mit einem Velo.';
})();

/* the ranking is what turns one road into a finding: it leads the canton */
(function(){
  const narrow = document.body.clientWidth < 520;
  document.getElementById('rank').style.setProperty('--rlabw', narrow ? '116px' : '190px');
  let h = '<h3>Anteil Unfälle ohne zweite Partei — Strassen mit mindestens ' + MIN_N +
          ' Unfällen</h3>';
  RANK.forEach(function(r){
    const lead = r.street === 'Talalpstrasse';
    h += '<div class="rrow"><div class="rlab"><b>' + r.street + '</b>' +
         (narrow ? '<br><span class="rplace">' + r.place + '</span>' : ', ' + r.place) + '</div>' +
         '<div class="rtrack"><div class="rfill' + (lead ? ' accent' : '') +
         '" style="width:' + r.pct + '%"></div></div>' +
         '<div class="rval">' + Math.round(r.pct) + ' %</div></div>';
  });
  document.getElementById('rank').innerHTML = h;
})();

document.getElementById('src').innerHTML =
  'Unfälle mit Personenschaden, Kanton Glarus 2011–2025. Die Talalpstrasse führt von ' +
  'Filzbach zur Talstation der Sportbahnen Kerenzerberg und weiter bergwärts, ' +
  de(FACTS.km) + ' km lang. Gemessen an der Zahl der Unfälle pro Kilometer ist sie ' +
  'unauffällig; aussergewöhnlich ist, <i>wie</i> dort verunfallt wird. ' +
  'Quelle: Bundesamt für Strassen ASTRA, Strassenverkehrsunfallorte; ' +
  'Strassennamen: swisstopo; Strassenlänge: OpenStreetMap. Grafik: Südostschweiz';

(function(){
  let h = '<tr><th>Strasse</th><th>Ort</th><th>Unf&auml;lle</th>' +
          '<th>ohne zweite<br>Partei</th><th>Anteil</th></tr>';
  RANK.forEach(function(r){
    h += '<tr><td>' + r.street + '</td><td style="text-align:left">' + r.place + '</td><td>' +
         r.n + '</td><td>' + r.self + '</td><td>' + de(r.pct) + ' %</td></tr>';
  });
  h += '<tr><td colspan="2"><b>Kanton Glarus</b></td><td><b>' + FACTS.kanton_self.n +
       '</b></td><td><b>' + FACTS.kanton_self.k + '</b></td><td><b>' +
       de(FACTS.kanton_self.pct) + ' %</b></td></tr>';
  document.getElementById('tbl').innerHTML = h;
})();
</script>
</body>
</html>
