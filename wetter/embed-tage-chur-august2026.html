<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>August 2026 Chur – Tagesmittel vs. Normal</title>
<style>
  :root{--orange:#EE7733;--blau:#0068A4;--grau:#6b7280;--hell:#eef2f5;--rot:#c0392b;}
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1f2937;margin:0;padding:12px;background:#fff;}
  .card{max-width:696px;margin:0 auto;border:1px solid #e5e7eb;border-radius:14px;padding:14px 16px 16px;box-shadow:0 4px 18px rgba(0,0,0,.06);position:relative;overflow:hidden;}
  .accent{position:absolute;top:0;left:0;right:0;height:4px;background:var(--orange);}
  .kicker{color:var(--orange);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.68rem;margin-bottom:2px;}
  .main-title{font-size:1.12rem;font-weight:800;margin:2px 0;}
  .subtitle{font-size:.78rem;color:var(--grau);margin:0 0 12px;}
  .kpis{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .kpi{flex:1;min-width:120px;background:var(--hell);border-radius:9px;padding:8px 11px;}
  .kpi b{display:block;font-size:1.15rem;line-height:1.15;font-variant-numeric:tabular-nums;}
  .kpi span{font-size:.7rem;color:var(--grau);}
  .kpi.peak b{color:var(--rot);}.kpi.mean b{color:var(--blau);}
  svg{width:100%;display:block;touch-action:none;cursor:crosshair;overflow:visible;}
  .legend{display:flex;gap:14px;font-size:.74rem;color:var(--grau);margin-top:8px;flex-wrap:wrap;}
  .legend span{display:flex;align-items:center;gap:5px;}
  .leg-bar{width:14px;height:10px;border-radius:2px;display:inline-block;}
  .leg-line{width:20px;border-top:2px dashed #9ca3af;display:inline-block;}
  .note{font-size:.66rem;color:var(--grau);margin-top:12px;line-height:1.45;}
  .tip{position:fixed;pointer-events:none;background:#fff;border:1px solid #d1d5db;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.14);padding:6px 10px;font-size:.78rem;opacity:0;transition:opacity .07s;z-index:60;}
  .tip b{display:block;font-size:.9rem;margin-bottom:2px;}
</style>
</head>
<body>
<div class="card">
  <div class="accent"></div>
  <div class="kicker">Chur · August 2026</div>
  <div class="main-title">Tagesdurchschnitt: August 2026 vs. Normal</div>
  <div class="subtitle">Balken = Tagesmittel · gestrichelte Linie = Durchschnitt 1991–2020</div>

  <div class="kpis" id="kpis"></div>

  <svg id="svg" role="img" aria-label="Tagesmitteltemperatur August 2026 Chur im Vergleich zum Normalwert"></svg>
  <div class="legend">
    <span><span class="leg-bar" style="background:#B5001E"></span> Hitzetag (Max ≥ 30 °C)</span>
    <span><span class="leg-bar" style="background:#EE7733"></span> Sommertag (Max ≥ 25 °C)</span>
    <span><span class="leg-bar" style="background:#a0b4c8"></span> darunter</span>
    <span><span class="leg-line"></span> Normal 1991–2020</span>
  </div>
  <p class="note" id="note"></p>
</div>
<div class="tip" id="tip"></div>
<script>
"use strict";
// === Verifizierte Daten (MeteoSchweiz SMN Chur, Stand 08.09.2026, provisorisch) ===
// Tagesmittel (tre200d0), Tagesmaximum (tre200dx) – exakt gegen data.geo.admin.ch geprüft.
const MEAN={1:23.0,2:25.4,3:29.2,4:28.9,5:25.9,6:23.7,7:22.7,8:24.7,9:26.1,10:25.3,11:25.4,12:26.0,13:26.2,14:27.2,15:26.1,16:24.9,17:18.6,18:21.2,19:25.4,20:20.7,21:15.6,22:17.0,23:18.1,24:21.0,25:19.1,26:22.3,27:26.4,28:21.7,29:18.9,30:21.2,31:21.0};
const MAX ={1:28.5,2:33.0,3:36.5,4:37.7,5:33.5,6:28.4,7:28.3,8:32.3,9:36.4,10:34.1,11:33.7,12:33.2,13:35.6,14:37.0,15:34.8,16:32.6,17:20.2,18:27.0,19:31.9,20:25.1,21:17.7,22:23.0,23:24.6,24:27.0,25:23.2,26:28.7,27:32.3,28:30.2,29:24.9,30:27.7,31:24.3};
const NORM={1:19.9,2:19.9,3:19.9,4:19.9,5:19.8,6:19.7,7:19.6,8:19.5,9:19.4,10:19.3,11:19.2,12:19.1,13:19.1,14:19.1,15:19.1,16:19.1,17:19.1,18:19.1,19:19.1,20:19.1,21:19.1,22:19.0,23:18.9,24:18.6,25:18.4,26:18.1,27:18.0,28:17.9,29:17.8,30:17.6,31:17.5};
const STAND="8. September 2026";

const days=Object.keys(MEAN).map(Number).sort((a,b)=>a-b);
const $=id=>document.getElementById(id);

// === Kennzahlen aus den Daten berechnen (keine Handeingabe → kein Widerspruch) ===
const meanVals=days.map(d=>MEAN[d]);
const monMean=meanVals.reduce((a,b)=>a+b,0)/meanVals.length;
let peakDay=days[0]; days.forEach(d=>{ if(MAX[d]>MAX[peakDay]) peakDay=d; });
const sommer=days.filter(d=>MAX[d]>=25).length;
const hitze =days.filter(d=>MAX[d]>=30).length;
$('kpis').innerHTML=
  `<div class="kpi mean"><b>${monMean.toFixed(1)} °C</b><span>Monatsmittel (Normal: 19.0 °C)</span></div>`+
  `<div class="kpi peak"><b>${MAX[peakDay].toFixed(1)} °C</b><span>Höchster Tageswert (${peakDay}. August)</span></div>`+
  `<div class="kpi"><b>${sommer}</b><span>Sommertage (Max ≥ 25 °C)</span></div>`+
  `<div class="kpi"><b>${hitze}</b><span>Hitzetage (Max ≥ 30 °C)</span></div>`;
$('note').innerHTML=`Quelle: MeteoSchweiz (Open Government Data, CC BY), automatische Station Chur (SMN, 556&nbsp;m). <b>2026 provisorisch und unkorrigiert</b>, Stand ${STAND}. Kennzahlen: eigene Auswertung. Normal = geglätteter Tagesdurchschnitt 1991–2020. Sommertag = Tagesmaximum ≥ 25 °C, Hitzetag ≥ 30 °C.`;

// === responsives Rendern (pixelbasiert → auf dem Handy lesbar) ===
const svg=$('svg');
function render(){
  const W=Math.round(svg.getBoundingClientRect().width)||660;
  const small=W<460, H=small?190:210, m={l:34,r:8,t:12,b:30};
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.style.height=H+'px';
  const slotW=(W-m.l-m.r)/days.length, bw=slotW*0.74;
  const X=d=>m.l+(d-0.5)*slotW;
  const allV=[...meanVals,...days.map(d=>NORM[d])];
  const ymin=Math.floor(Math.min(...allV)/2)*2-1, ymax=Math.ceil(Math.max(...allV)/2)*2+1;
  const Y=v=>H-m.b-(v-ymin)/(ymax-ymin)*(H-m.t-m.b);
  let s='';
  for(let v=Math.ceil(ymin/2)*2;v<=ymax;v+=2){
    s+=`<line x1="${m.l}" y1="${Y(v).toFixed(1)}" x2="${W-m.r}" y2="${Y(v).toFixed(1)}" stroke="#f0f0f0"/>`;
    s+=`<text x="${m.l-5}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#9ca3af">${v}°</text>`;
  }
  days.forEach(d=>{
    const x=X(d), v=MEAN[d], isHitze=MAX[d]>=30, isSommer=MAX[d]>=25, isPeak=d===peakDay;
    const barCol=isHitze?'#B5001E':(isSommer?'#EE7733':'#a0b4c8');
    s+=`<rect x="${(x-bw/2).toFixed(1)}" y="${Y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H-m.b-Y(v)).toFixed(1)}" fill="${barCol}" opacity="0.9"${isPeak?' stroke="#c0392b" stroke-width="1.4"':''}/>`;
  });
  // Normal-Linie
  let p=''; days.forEach(d=>{ p+=(p?'L':'M')+X(d).toFixed(1)+' '+Y(NORM[d]).toFixed(1); });
  s+=`<path d="${p}" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5 3"/>`;
  // Höchstwert-Markierung (Max-Tag, damit er nicht mit dem höchsten Mittel-Balken verwechselt wird)
  s+=`<text x="${X(peakDay).toFixed(1)}" y="${(Y(MEAN[peakDay])-6).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c0392b">↑${MAX[peakDay].toFixed(1)}°</text>`;
  // x-Achse
  days.forEach(d=>{ if(d===1||d%5===0){
    s+=`<line x1="${X(d).toFixed(1)}" y1="${H-m.b}" x2="${X(d).toFixed(1)}" y2="${(H-m.b+3).toFixed(1)}" stroke="#e5e7eb"/>`;
    s+=`<text x="${X(d).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10" fill="#9ca3af">${d}.</text>`;
  }});
  s+=`<text x="${(m.l+(W-m.l-m.r)/2).toFixed(1)}" y="${H-1}" text-anchor="middle" font-size="9.5" fill="#9ca3af">August 2026</text>`;
  svg.innerHTML=s;
  META={m,slotW,X,W};
}
let META=null, raf;
window.addEventListener('resize',()=>{ cancelAnimationFrame(raf); raf=requestAnimationFrame(render); });
render();

// === Tooltip ===
const tip=$('tip');
svg.addEventListener('pointermove',ev=>{
  if(!META)return;
  const r=svg.getBoundingClientRect(), xi=(ev.clientX-r.left)/r.width*META.W;
  let best=days[0],bd=1e9; days.forEach(d=>{ const dist=Math.abs(META.X(d)-xi); if(dist<bd){bd=dist;best=d;} });
  const v=MEAN[best], n=NORM[best], mx=MAX[best], diff=v-n;
  const sTag=mx>=30?'<span style="color:#B5001E;font-weight:700">Hitzetag</span>':(mx>=25?'<span style="color:#EE7733;font-weight:700">Sommertag</span>':'kein Sommertag');
  tip.innerHTML=`<b>${best}. August 2026</b>Tagesmittel: ${v.toFixed(1)} °C (${diff>=0?'+':'−'}${Math.abs(diff).toFixed(1)} vs. Normal)<br>Höchstwert: ${mx.toFixed(1)} °C · ${sTag}`;
  tip.style.opacity=1;
  let lx=ev.clientX+12; if(lx+240>window.innerWidth)lx=ev.clientX-244;
  let ty=ev.clientY-46; if(ty<4)ty=ev.clientY+16;
  tip.style.left=Math.max(4,lx)+'px'; tip.style.top=ty+'px';
});
svg.addEventListener('pointerleave',()=>tip.style.opacity=0);
</script>
</body>
</html>
